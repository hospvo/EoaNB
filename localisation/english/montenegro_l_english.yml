 MNT_crisis_effect_40_a:0 "§YClose this information dossier.§! No time, political power, trust or crisis resources are spent."
 MNT_crisis_empty:0 ""
 MNT_crisis_escalation_label:0 "£MNT_crisis_escalation_texticon£ WAR TENSION    §R[?MNT.MNT_crisis_escalation|0] / 100§!   ·   talks at §Y85§!"
 MNT_crisis_escalation_tt:0 "§YRisk of open conflict§!\n+1 each week during indirect war. Armed escorts and unrestricted raids add more. Restraint and mediation reduce it. At 85, the crisis moves to urgent negotiations; war follows only if talks are abandoned. Normal talks open after 196 days, or can be requested after 84."
 MNT_crisis_evidence:0 "Witness testimony has been collected"
 MNT_crisis_focus_battle_auto_tt:0 "§YRecorded automatically by the battlefield missions.§! This is a result of open war, separate from the peaceful negotiating package."
 MNT_crisis_focus_captains_tt:0 "£MNT_crisis_diplomacy_texticon£ §YConsults the border captains§! after 1 day if their terms have not been settled. Choose discipline or unrestricted raids in the event.\nOtherwise: £MNT_crisis_strength_texticon£ strength §G+5§! (maximum 100)."
 MNT_crisis_focus_case_tt:0 "£MNT_crisis_credibility_texticon£ Reputation: §G+10§! (maximum 100).\n£MNT_crisis_diplomacy_texticon£ Use §YVaclík's memorandum§! and the §Ythree independent patron appeals§! in Decisions."
 MNT_crisis_focus_clans_tt:0 "During §Yindirect war§!: £MNT_crisis_strength_texticon£ rebel strength: §G+8§! (maximum 100).\n£infantry_equipment_texticon£ Rifles: §G+50§!\n§YPrepares the clan levy templates and unlocks wartime musters in the Clan Assembly.§!"
 MNT_crisis_focus_intensify_tt:0 "£MNT_crisis_strength_texticon£ Rebel strength: §G+12§! (maximum 100).\n£MNT_crisis_escalation_texticon£ War tension: §R+15§! (maximum 100).\n§YRequires at least 55 rebel strength during indirect war.§!"
 MNT_crisis_focus_routes_tt:0 "£MNT_crisis_supply_texticon£ Supplies: §G+21 days§! (maximum 90).\n£infantry_equipment_texticon£ Rifles: §G+50§!\n§YEstablishes prepared routes§!: discreet ammunition crossings now yield §G35 supply days and +8 strength§!."
 MNT_crisis_focus_settlement_auto_tt:0 "§YRecorded automatically when a settlement is accepted.§! The signed package in Decisions determines its terms."
 MNT_crisis_focus_talks_auto_tt:0 "§YRecorded automatically when talks begin.§! Use the uprising decisions to request or manage negotiations."
 MNT_crisis_focus_war_auto_tt:0 "§YRecorded automatically when open war begins.§! Choose war through the uprising decisions or the final mediation event."
 MNT_crisis_foreign_austria_mediation:0 "AUSTRIA · Offer mediation over Herzegovina"
 MNT_crisis_foreign_austria_mediation_desc:0 "$MNT_crisis_foreign_mediation_tt$\n\nThe shared gauges always show the Herzegovinian crisis, even when viewing this panel as a foreign power. This does not permit editing Montenegro's demands."
 MNT_crisis_foreign_austria_pressure:0 "AUSTRIA · Sponsor a frontier guarantee"
 MNT_crisis_foreign_austria_pressure_desc:0 "$MNT_crisis_foreign_pressure_tt$\n\n§YRequires our mediation (level 2).§! France also requires 60 reputation; Austria requires the absence of unrestricted raids. Already active pressure cannot be granted twice."
 MNT_crisis_foreign_france_mediation:0 "FRANCE · Offer mediation over Herzegovina"
 MNT_crisis_foreign_france_mediation_desc:0 "$MNT_crisis_foreign_mediation_tt$\n\nThe shared gauges always show the Herzegovinian crisis, even when viewing this panel as a foreign power. This does not permit editing Montenegro's demands."
 MNT_crisis_foreign_france_pressure:0 "FRANCE · Authorize an Adriatic demonstration"
 MNT_crisis_foreign_france_pressure_desc:0 "$MNT_crisis_foreign_pressure_tt$\n\n§YRequires our mediation (level 2).§! France also requires 60 reputation; Austria requires the absence of unrestricted raids. Already active pressure cannot be granted twice."
 MNT_crisis_foreign_mediation_tt:0 "£MNT_crisis_diplomacy_texticon£ §YOpens our reply to the Montenegrin appeal.§!\nChoose sympathy or, with reputation §Y≥45§! and war tension §Y<75§!, mediation. Each level adds §G2 bargaining power§! to the shared dossier. Our existing stronger backing cannot be downgraded."
 MNT_crisis_foreign_pressure_tt:0 "£MNT_crisis_diplomacy_texticon£ §YOpens our country's intervention event.§!\nThe option previews show the exact effects before commitment. Active pressure reaches §Glevel 3§!. This is limited diplomatic assistance and does not declare war."
 MNT_crisis_foreign_russia_mediation:0 "RUSSIA · Offer mediation over Herzegovina"
 MNT_crisis_foreign_russia_mediation_desc:0 "$MNT_crisis_foreign_mediation_tt$\n\nThe shared gauges always show the Herzegovinian crisis, even when viewing this panel as a foreign power. This does not permit editing Montenegro's demands."
 MNT_crisis_foreign_russia_pressure:0 "RUSSIA · Fund the Herzegovinian insurgents"
 MNT_crisis_foreign_russia_pressure_desc:0 "$MNT_crisis_foreign_pressure_tt$\n\n§YRequires our mediation (level 2).§! France also requires 60 reputation; Austria requires the absence of unrestricted raids. Already active pressure cannot be granted twice."
 MNT_crisis_france_card:0 "[FRA.GetFlag] France\n[MNTcrisis_france]"
 MNT_crisis_french_squadron:0 "PRESSURE · Request a French naval demonstration"
 MNT_crisis_french_squadron_desc:0 "Request a French naval demonstration.\n[GetMNTSupportFrancePressure]\nWar tension: §G-8§!."
 MNT_crisis_goal:0 "[MNTcrisisGoal]"
 MNT_crisis_goal_1:0 "Supply the rebels and win foreign support. Use both to secure a peace deal."
 MNT_crisis_goal_2:0 "Choose your peace terms. You have 3 proposals and 56 days."
 MNT_crisis_goal_3:0 "Hold the frontier. The battlefield missions determine the settlement."
 MNT_crisis_goal_4:0 "The campaign is resolved. Complete the next national focus to close this dossier."
 MNT_crisis_goal_austria:0 "[AUS.GetFlag] Mediate for a quiet frontier. An Austrian guarantee commits Montenegro to restraining raids."
 MNT_crisis_goal_france:0 "[FRA.GetFlag] Choose French mediation or naval pressure in Decisions. The draft is controlled by Montenegro."
 MNT_crisis_goal_observer:0 "[SER.GetFlag] Follow the Herzegovinian uprising and the shared diplomatic dossier. Montenegro controls its draft."
 MNT_crisis_goal_ottoman:0 "[OTO.GetFlag] Interrupt rebel supplies or restrain officials. Respond to proposals through the Ottoman delegation event."
 MNT_crisis_goal_russia:0 "[RUS.GetFlag] Offer mediation, funds and supplies in Decisions. French and Russian backing can coexist."
 MNT_crisis_leader_name:0 "§YLuka\nVukalović§!"
 MNT_crisis_leader_relationship:0 "TRUST: §Y[MNTcrisisVukalovicValue]/100§!\n[MNTcrisisVukalovicTrust]"
 MNT_crisis_leader_tt:0 "§YLuka Vukalović · cooperation with Cetinje§!\nTrust: §Y[MNTcrisisVukalovicValue]/100§! · [MNTcrisisVukalovicTrust]\n\n£MNT_crisis_supply_texticon£ Discreet ammunition delivery: §G+6§!. Armed escort: §G+10§!.\n£MNT_crisis_strength_texticon£ Disciplined aid agreed with the captains: §G+4§!. A free hand for raids: §G+8§!, with the separate war tension and reputation costs shown in that event.\n£MNT_crisis_diplomacy_texticon£ Pausing operations to document the frontier: §R−4§!.\n\n§YClick the portrait to read the dossier.§! Trust records cooperation with the insurgent leadership. It does not replace supplies, military strength, reputation or clan loyalty, and currently grants no separate combat bonus."
 MNT_crisis_legacy_desc:0 "[herzegovina_uprising_stages]"
 MNT_crisis_map_caption:0 "§YHERZEGOVINA§!"
 MNT_crisis_map_tt:0 "§YHerzegovina · the uprising's theatre§!\nThe gold silhouette follows the provinces of §YHerzegovina (state 1205)§! in this mod, with north at the top. It shows the region, not rebel control, an independent state or the area affected by every individual rising."
 MNT_crisis_memorandum:0 "DIPLOMACY · Vaclík's memorandum"
 MNT_crisis_memorandum_desc:0 "Send Vaclík's report to foreign governments.\n\n£MNT_crisis_credibility_texticon£ Reputation: §G+20§! (maximum 100).\n\n§YRequires Build the Diplomatic Case or witness reports.§! Available once. France and Russia can both support you."
 MNT_crisis_no:0 "§gNot included§!"
 MNT_crisis_not_ready:0 "§RMore bargaining power or fewer demands needed§!"
 MNT_crisis_open_conflict:0 "End Talks and Declare War"
 MNT_crisis_open_conflict_desc:0 "£MNT_crisis_escalation_texticon£ §ROPEN WAR WITH THE OTTOMAN EMPIRE§!\n\n$MNT_frontier_war_rules$"
 MNT_crisis_ottoman_start_tt:0 "§YThe Herzegovinian uprising begins.§!\nThe new crisis panel in §YDecisions§! tracks rebel strength, supplies, war tension and foreign mediation once Montenegro completes §YSupport the Herzegovinian Uprising§!.\n§YThe Ottoman Empire§! can interrupt supplies, restrain officials and respond to negotiating proposals. Retired uprising and conference timers are replaced by this system."
 MNT_crisis_panel_readiness_default:0 "[MNTcrisisReadiness]"
 MNT_crisis_patrons_title:0 "£MNT_crisis_diplomacy_texticon£ FOREIGN SUPPORT   ·   £MNT_crisis_credibility_texticon£ REPUTATION §Y[?MNT.MNT_crisis_reputation|0]/100§!"
 MNT_crisis_patrons_tt:0 "§YIndependent foreign positions§!\n0: uncommitted. 1: sympathy. 2: mediation. 3: active pressure.\nFrance: a naval demonstration. Russia: funds and supplies. Austria: trade and a guaranteed frontier. French and Russian assistance can coexist.\n\nDiplomatic reputation: [?MNT.MNT_crisis_reputation|0] / 100. At least 45 reputation and war tension below 75 permit mediation when a dossier is answered. An already promised level does not automatically decay."
 MNT_crisis_phase_1:0 "§YHERZEGOVINA§! · Indirect war"
 MNT_crisis_phase_2:0 "§YHERZEGOVINA§! · Negotiations"
 MNT_crisis_phase_3:0 "§YHERZEGOVINA§! · §ROpen war§!"
 MNT_crisis_phase_4:0 "§YHERZEGOVINA§! · §GSettlement§!"
 MNT_crisis_phase_label:0 "[MNTcrisisPhase]"
 MNT_crisis_ready:0 "§GTerms can be accepted§!"
 MNT_crisis_record_close:0 "Close."
 MNT_crisis_record_desc:0 "The signed peace deal:\n\n[MNTtreatySignedBase][MNTtreatySignedBorder][MNTtreatySignedArms][MNTtreatySignedRecognition][MNTtreatySignedGuarantee][MNTtreatySignedReparations][MNTrelTermsSigned]\n[MNTtreatyCommissionStatus]"
 MNT_crisis_rejection_final_tt:0 "£MNT_crisis_diplomacy_texticon£ §RAll 3 submissions have been used.§!\nThe final mediation event arrives after §Y1 day§!: accept limited terms or choose open war."
 MNT_crisis_rejection_revise_tt:0 "£MNT_crisis_diplomacy_texticon£ §YRevise the package in Decisions.§!\nSubmissions used: §Y[?MNT.MNT_crisis_round|0]/3§!.\nNo additional submission is spent by closing this event."
 MNT_crisis_reply_pending:0 "An Ottoman reply is pending"
 MNT_crisis_report_0:0 "§YLATEST DISPATCH§!\nThe insurgents need ammunition. Prepare a crossing or contact the merchants of Cattaro. One covert operation can be prepared at a time."
 MNT_crisis_report_1:0 "§YLATEST DISPATCH§!\nGuides delivered the ammunition discreetly. Prepared routes improve future crossings. Review supply days before ordering another operation."
 MNT_crisis_report_2:0 "§YLATEST DISPATCH§!\nAn armed escort delivered the crates, but Ottoman observers traced the men to Cetinje. More strength has come at the cost of war tension."
 MNT_crisis_report_3:0 "§YLATEST DISPATCH§!\nWitness statements have strengthened our diplomatic case. Send a dossier to a foreign court while war tension remains below 75."
 MNT_crisis_report_4:0 "§YLATEST DISPATCH§!\nSelective accounts have damaged our reputation. Foreign sympathy may not translate into mediation."
 MNT_crisis_report_5:0 "§YLATEST DISPATCH§!\nCattaro merchants established a supply route. Austrian backing makes further traffic safer. The ammunition operation now benefits from prepared guides."
 MNT_crisis_routes:0 "Prepared supply routes"
 MNT_crisis_rules_tt:0 "§YINDIRECT WAR§!\n£MNT_crisis_supply_texticon£ Supplies sustain £MNT_crisis_strength_texticon£ rebel strength.\n£MNT_crisis_escalation_texticon£ Overt action increases war tension; at §Y85§!, urgent talks begin.\n£MNT_crisis_credibility_texticon£ Credibility and £MNT_crisis_diplomacy_texticon£ foreign backing add negotiating bargaining power."
 MNT_crisis_russia_card:0 "[RUS.GetFlag] Russia\n[MNTcrisis_russia]"
 MNT_crisis_russian_aid:0 "SUPPORT · Request Russian funds and supplies"
 MNT_crisis_russian_aid_desc:0 "Request Russian funds and supplies.\n[GetMNTSupportRussiaPressure]\nSupplies: §G+28 days§!."
 MNT_crisis_seek_talks:0 "Start Peace Talks"
 MNT_crisis_seek_talks_desc:0 "Start peace talks after at least §Y84 days§! of the uprising. Choose the terms in the peace panel. Supplies are not used during talks."
 MNT_crisis_settled_dispatch:0 "§GCRISIS ENDED§!\nUse §YReview the Peace Deal§! below to see the signed terms. A border commission follows a negotiated deal after 90 days."
 MNT_crisis_settlement_record:0 "Review the Peace Deal"
 MNT_crisis_settlement_record_desc:0 "View the signed package again. This does not grant further rewards or change the agreed terms."
 MNT_crisis_stance_0:0 "§gUncommitted · 0§!"
 MNT_crisis_stance_1:0 "Sympathy · 1"
 MNT_crisis_stance_2:0 "§YMediation · 2§!"
 MNT_crisis_stance_3:0 "§GPressure · 3§!"
 MNT_crisis_strength_label:0 "£MNT_crisis_strength_texticon£ REBEL STRENGTH    §G[?MNT.MNT_crisis_strength|0] / 100§!"
 MNT_crisis_strength_tt:0 "§YInsurgent strength§!\nWhile supplied: +1 each week. Without 7 days of supplies: -6 each week. Ottoman concentrations in Herzegovina add pressure. Operations and clan decisions can increase strength.\n\nAt 10 or below, the uprising needs immediate mediation. Every 20 points contributes approximately one point of negotiating bargaining power."
 MNT_crisis_submit:0 "Send Proposal"
 MNT_crisis_submit_desc:0 "Send your chosen terms. A reply takes §Y7 days§! and uses §Y1 of 3 proposals§!. Terms are locked while waiting. Included reparations add §R1M national debt§! only when the treaty is signed."
 MNT_crisis_supply_label:0 "£MNT_crisis_supply_texticon£ SUPPLIES    §C[?MNT.MNT_crisis_supplies|0] days§!   ·   §Y7/week§!"
 MNT_crisis_supply_tt:0 "§YSupplies§!\nRebels use 7 supply days each week during indirect war, after Support the Herzegovinian Uprising. Send ammunition or use the Cattaro route to keep them supplied.\nMaximum: §Y90 days§!. Weekly supply use and automatic strength changes stop during talks."
 MNT_crisis_talks_dispatch:0 "§YDRAFT§! · Round [?MNT.MNT_crisis_round|0]/3 · Day [?MNT.MNT_crisis_phase_days|0]/56\nLeverage §G[?MNT.MNT_crisis_leverage|0]§! / resistance §Y[?MNT.MNT_crisis_price|0]§! · [MNTcrisisPanelReadiness]\nBoundary: [MNTcrisis_demand_border] · Arms: [MNTcrisis_demand_arms]\nRecognition: [MNTcrisis_demand_recognition]\nGuarantee: [MNTcrisis_offer_guarantee] · Reparations: [MNTcrisis_offer_reparations]"
 MNT_crisis_talks_phase_tt:0 "Negotiations are in progress."
 MNT_crisis_toggle_demand_arms:0 "DRAFT · Arms imports [MNTcrisis_demand_arms]"
 MNT_crisis_toggle_demand_arms_desc:0 "£MNT_crisis_strength_texticon£ Add or withdraw permission to §Yimport arms§!.\nOttoman resistance: §R+2§! while included.\n\n§YPermission is recorded only when the complete package is accepted.§!"
 MNT_crisis_toggle_demand_border:0 "DRAFT · Outer Montenegro [MNTcrisis_demand_border]"
 MNT_crisis_toggle_demand_border_desc:0 "£MNT_crisis_diplomacy_texticon£ Add or withdraw the claim to §YOuter Montenegro§!.\nOttoman resistance: §R+5§! while included.\n\n§YOnly an accepted package containing this claim transfers Ottoman-owned Outer Montenegro.§! A temporary demilitarized zone lasts §Y90 days§!."
 MNT_crisis_toggle_demand_recognition:0 "DRAFT · Formal recognition [MNTcrisis_demand_recognition]"
 MNT_crisis_toggle_demand_recognition_desc:0 "£MNT_crisis_diplomacy_texticon£ Add or withdraw §Yformal international recognition§!.\nOttoman resistance: §R+8§! while included.\n\n§YAcceptance also requires:§!\n£MNT_crisis_strength_texticon£ Strength §Y≥75§!.\n[FRA.GetFlag] France and [RUS.GetFlag] Russia both at §Ymediation (level 2) or better§!.\n\nFactual self-rule is already part of the basic package."
 MNT_crisis_toggle_offer_guarantee:0 "DRAFT · Frontier guarantee [MNTcrisis_offer_guarantee]"
 MNT_crisis_toggle_offer_guarantee_desc:0 "£MNT_crisis_diplomacy_texticon£ Offer or withdraw a §Yfrontier guarantee§! to restrain cross-border raids.\nOttoman resistance: §G−3§! while included.\n\n[AUS.GetFlag] §YAustria at active pressure (level 3) locks this pledge into the draft.§!"
 MNT_crisis_toggle_offer_reparations:0 "DRAFT · Reparations [MNTcrisis_offer_reparations]"
 MNT_crisis_toggle_offer_reparations_desc:0 "Offer to take on 1 million pounds of Ottoman debt. Ottoman demands: §G-2§!. The debt transfer happens once, when the treaty is signed."
 MNT_crisis_treaty_arms_tt:0 "£MNT_treaty_arms_texticon£ [MNT.GetFlag] Montenegro gets §Yarms import rights§!.\n- Permission to import; no rifles delivered now.\n"
 MNT_crisis_treaty_border_tt:0 "£MNT_treaty_frontier_texticon£ [MNT.GetFlag] Montenegro gains §YOuter Montenegro§!.\n- No troops may enter the new territory for §Y90 days§!.\n"
 MNT_crisis_treaty_focus_tt:0 "£political_power_texticon£ Completes §YFrontier Settlement§!: §G+10 political power§!.\n"
 MNT_crisis_treaty_guarantee_tt:0 "£MNT_treaty_guarantee_texticon£ [MNT.GetFlag] Montenegro promises to §Ystop border raids§!.\n"
 MNT_crisis_treaty_recognition_tt:0 "£MNT_treaty_recognition_texticon£ [MNT.GetFlag] Montenegro gains §Yformal recognition§!.\n"
 MNT_crisis_treaty_reparations_tt:0 "£MNT_treaty_reparations_texticon£ [MNT.GetFlag] National debt: §R+1M§!. [OTO.GetFlag] National debt: §G-1M§!.\n"
