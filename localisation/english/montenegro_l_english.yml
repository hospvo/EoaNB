 MNT_missing_metropolitan_desc:0 "The metropolitan’s seat has been vacant since Petar II died in 1851. Clergy and monasteries continue their work, but the church lacks a consecrated head. Fill the office through Consecrate Nikanor Ivanović. Stability -2.5%; daily political power -0.05."
