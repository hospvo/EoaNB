 OTO_battleofgrahovac.1.a:0 "Calm down the situation."
 OTO_battleofgrahovac.1.b:0 "Send in the Army."
 OTO_battleofgrahovac.1.d:0 "Tensions have been gradually rising on our border. Now it almost looks like war had broken out there. There was always some tension on both sides, but now it looks like it had boiled over. There are reports of shootings and looting of border villages. The population is fleeing to the mountain areas to save themself and the little belongings they have left from that madness. We need to quickly decide what to do because this situation could destabilize the whole region. We could try to calm the situation down with words and offer some kind of appeasement, or we could send in the army to destroy those bandits."
 OTO_battleofgrahovac.1.t:0 "Escalation on the Border"
 OTO_battleofgrahovac.2.a:0 "Calm down the situation."
 OTO_battleofgrahovac.2.b:0 "Send in the Army."
 OTO_battleofgrahovac.2.d:0 "Tensions have been gradually rising on our Montenegrin border. Now it almost looks like war had broken out there. There was always some tension on both sides, but now it looks like it had boiled over. There are reports of shootings and looting of border villages. The population is fleeing to the mountain areas to save themself and the little belongings they have left from that madness. We need to quickly decide what to do because this situation could destabilize the whole region. We could try to calm the situation down with words and offer some kind of appeasement, or we could send in the army to destroy those bandits."
 OTO_battleofgrahovac.2.t:0 "Escalation on the Border"
 OTO_battleofgrahovac.3.a:0 "New clans support our cause. Excellent news."
 OTO_battleofgrahovac.3.d:0 "Today we gain some interesting information from another side of our border. On by Ottoman's occupied territory, the armed rebellion had started. Its main fighting force is the Vasojevići clan which isn't cooperating with Ottoman authorities for many years. They used the situation and tried to successfully contact us. They want to join our fight against our joint oppressor. If all goes best for us, we can potentially incorporate their territory into our state."
 OTO_battleofgrahovac.3.t:0 "New Revolt of Vasojevići Clan"
 OTO_battleofgrahovac.4.a:0 "New clans support our cause. Excellent news."
 OTO_battleofgrahovac.4.d:0 "Today we gain some interesting information from another side of our border. On by Ottoman's occupied territory, the armed rebellion had started. Its main fighting force is the Kuči clan which isn't cooperating with Ottoman authorities for many years. They used the situation and tried to successfully contact us. They want to join our fight against our joint oppressor. If all goes best for us, we can potentially incorporate their territory into our state."
 OTO_battleofgrahovac.4.t:0 "New Revolt of Kuči Clan"
 OTO_battleofgrahovac.5.a:0 "New clans support our cause. Excellent news."
 OTO_battleofgrahovac.5.d:0 "Today we gain some interesting information from another side of our border. On by Ottoman's occupied territory, the armed rebellion had started. Its main fighting force is the Grahovo clan which isn't cooperating with Ottoman authorities for many years. They used the situation and tried to successfully contact us. They want to join our fight against our joint oppressor. If all goes best for us, we can potentially incorporate their territory into our state."
 OTO_battleofgrahovac.5.t:0 "New Revolt of Grahovo Clan"
 OTO_battleofgrahovac.6.a:0 "We must send in the army."
 OTO_battleofgrahovac.6.b:0 "Let's ignore it, we can't afford another confrontation."
 OTO_battleofgrahovac.6.t:0 "Montenegro Collects Taxes in Our Lands"
 OTO_battleofgrahovac.7.a:0 "Let's hope it can be put down quickly."
 OTO_battleofgrahovac.7.t:0 "Uprising in Herzegovina"
 OTO_battleofgrahovac.8.d:0 "Today we got a message that our local garrison in Sarajevo capitulated to the enemy. Our commander capitulated at the hands of Luka Vukalović himself. Vukalović and his army then monumentally entered the city. His parade throw town with captured frags and much more loot was observed, by great numbers of local mainly Serb population. This is a great, strategic victory for an uprising, which will bring many new volunteers to their ranks. It is starting to be a huge problem, potentially threatening the stability of the whole Balkan region."
 OTO_battleofgrahovac.8.t:0 "Luka Vukalović Enters Sarajevo"
 OTO_battleofgrahovac.9.a:0 "Let's hope it can be put down quickly."
 OTO_battleofgrahovac.9.d:0 "Today message arrived to our ministries that we have lost contact with a few of our garrisons and other administrative personnel in our very unstable region of Herzegovina. The province of Herzegovina was full of tension and damaged by our latest attempts at pacifying it. This was combined at the right time with a spark, and all exploded. As possibly predicted. Our spark was a bad harvest, the risk of famine, and our local administrative inefficiency."
 OTO_battleofgrahovac.9.t:0 "Uprising in Herzegovina"
 OTO_battleofgrahovac.10.a:0 "Let's hope it will end quickly."
 OTO_battleofgrahovac.10.d:0 "Today we gain to our hands news from Herzegovina about the uprising which is raging on. We have reported that our forces are fighting a brutal guerrilla war with rebels. Our garrisons are almost constantly harassed from every side, and they then return to the civilian population because of their sympathies with rebels."
 OTO_battleofgrahovac.10.t:0 "Internal Report on the Situation in Herzegovina"
 OTO_battleofgrahovac.11.a:0 "No negotiation, no compromise, we can handle it."
 OTO_battleofgrahovac.11.b:0 "Negotiation is necessary to have control over the situation."
 OTO_battleofgrahovac.11.d:0 "Some time had passed since the uprising in Herzegovina started, and it's still going in full power. It's beginning to be the discreditation of our armed forces that they can't defeat some farmers and bandits from the mountains. We have several options for what we can do. We can try to defeat the rebellion by force, which could potentially prolong our shame. Another alternative option is to try to contact the Montenegrin government and negotiate with them in Mostar. Montenegrins almost openly support them by sending to Herzegovina almost everything they ask for, from weapons to volunteers. The goals of negotiation have to be the situation in Herzegovina and the so-called Montenegrin question. But we need to be careful during meetings because we could be bought down in open border conflict."
 OTO_battleofgrahovac.11.t:0 "What Will We Do Next About Herzegovina?"
 OTO_battleofgrahovac.12.a:0 "Fair fight. Better many honored losses than one dishonest win."
 OTO_battleofgrahovac.12.b:0 "History only asks who won. How is a question for defeated."
 OTO_battleofgrahovac.12.d:0 "Our armies are looking against each other. The battle is about to begin. We are at a crossroad that could decide the fate of our nation for many future years. The choice of our strategy is a crucial matter which could be the difference between victory, defeat, and dishonor. We have options to fight honorably and possibly be defeated or fight even by tricks and unfair tactics but win no matter what could cost it. §G For a win you gain 1 §! £negotiations_texticon §R for a loss you lose 1 §! £negotiations_texticon      §C by choosing your strategy you can adjust your chances of winning and gaining points§!"
 OTO_battleofgrahovac.12.t:0 "Choose a Tactic Before the Battle"
 OTO_battleofgrahovac.13.a:0 "Fair fight. Better many honored losses than one dishonest win."
 OTO_battleofgrahovac.13.b:0 "History only asks who won. How is a question for defeated."
 OTO_battleofgrahovac.13.t:0 "Choose a Tactic Before the Battle"
 OTO_battleofgrahovac.14.a:0 "Fair fight. Better many honored losses than one dishonest win."
 OTO_battleofgrahovac.14.b:0 "History only asks who won. How is a question for defeated."
 OTO_battleofgrahovac.14.d:0 "Our armies are looking against each other. The battle is about to begin. We are at a crossroad that could decide the fate of our nation for many future years. The choice of our strategy is a crucial matter which could be the difference between victory, defeat, and dishonor. We have options to fight honorably and possibly be defeated or fight even by tricks and unfair tactics but win no matter what could cost it. But we need to be quick because our enemy had taken the initiative and is already making the first moves. §G For a win you gain 1 §! £negotiations_texticon §R for a loss you lose 1 §! £negotiations_texticon §C by choosing your strategy you can adjust your chances of winning and gaining points§!"
 OTO_battleofgrahovac.14.t:0 "Plan of Our Defense"
 OTO_battleofgrahovac.15.a:0 "What diplomats cannot solve, let to the military."
 OTO_battleofgrahovac.15.d:0 "News arrives from our delegation in Mostar. After a few hot moments of negotiation, our delegates managed to strike a deal. This hope for final peace was struck down by [opponent_country]. In this attitude, there is no other option than to take up arms againand fight for a better negotiation position."
 OTO_battleofgrahovac.15.t:0 "[opponent_country] Refuses to Sign the Mostar Convention"
 OTO_battleofgrahovac.16.a:0 "Well done, peace at last."
 OTO_battleofgrahovac.16.d:0 "News arrives from our delegation in Mostar. After a few hot moments of negotiation, our delegates managed to strike a deal. [opponent_country] has agreed to the terms of the agreement and is willing to sign it. This news was met with celebrations and signs of relief."
 OTO_battleofgrahovac.16.t:0 "[opponent_country] Agrees to Sign the Mostar Convention"
 OTO_battleofgrahovac.17.a:0 "How could this happen."
 OTO_battleofgrahovac.17.d:0 "Throw a truly brutal and very unfair tactic Montenegrins manage to defeat us in the field. This is hugely dishonest to our armed forces because they were beaten by an unprofessional armed farmer from the mountains. But this is not the worst thing of all. We need to negotiate with them and agree with most of their demands."
 OTO_battleofgrahovac.17.t:0 "Montenegrin Revolt Succeeded"
 OTO_battleofgrahovac.18.a:0 "Finally, we manage to achieve victory."
 OTO_battleofgrahovac.18.d:0 "Today we could successfully say that we manage to finish one thing that plague our lands for many months. A few hours ago, we receive information that the last of the rebel armed groups surrendered to our army. By this, one more problem in our hot Balkan frontier is finally solved. This unlocks to us more space to improve regional administration and stability in the area as a whole."
 OTO_battleofgrahovac.18.t:0 "Montenegrin Revolt Failed"
 OTO_battleofgrahovac.19.a:0 "Thanks."
 OTO_battleofgrahovac.19.b:0 "Thanks."
 OTO_battleofgrahovac.19.d:0 "Please, when this event fire to you, report it to us."
 OTO_battleofgrahovac.19.t:0 "Luka Vukalović Makes Moves"
 OTO_battleofgrahovac.20.a:0 "Let's celebrate this victory."
 OTO_battleofgrahovac.20.d:0 "We have now a report from a clash that occurred between our armies in earlier hours. It was firstly truly unbelievable, but after the raging battle calmed down winning side became clear. Our armies had managed to strike a glorious victory over the enemy, which had fled the battlefield and left much valuable loot which can we display during our parades."
 OTO_battleofgrahovac.20.t:0 "We Won the Battle"
 OTO_battleofgrahovac.21.a:0 "Oops."
 OTO_battleofgrahovac.21.d:0 "If you get this, something is probably wrong."
 OTO_battleofgrahovac.21.t:0 "Stalemate"
 OTO_battleofgrahovac.22.a:0 "We need more luck in future battles."
 OTO_battleofgrahovac.22.d:0 "We have now a report from a clash that occurred between our armies in earlier hours. It was firstly truly unbelievable, but after the raging battle calmed down winning side became clear. Our armies had been defeated and fled from the battlefield. This left our enemy with much valuable loot, which he could use as he wanted. It's truly a sad day for us all, and more specifically for close ones to them, who felt for nothing. Let's hope this will never repeat."
 OTO_battleofgrahovac.22.t:0 "We Were Defeated in the Battle"
 OTO_battleofgrahovac.23.a:0 "Brothers, to arms."
 OTO_battleofgrahovac.23.d:0 "After long and intensive negotiations in Mostar, the last hopes of a peaceful ending were struck down. Since there was no agreement between Ottoman delegate Kemal Efendi and delegate from Montenegro Henri Delarue, both sides turned from pens to firearms. It is to be feared that there will soon be escalations on the borders, which are already full of various skirmishes."
 OTO_battleofgrahovac.23.t:0 "Negotiations Failed"
 OTO_battleofgrahovac.24.a:0 "Sign the Mostar convention."
 OTO_battleofgrahovac.24.b:0 "Brothers, to arms."
 OTO_battleofgrahovac.24.d:0 "The negotiations in Mostar have ended today, and a final agreement was drawn. Here is its content:\n-[mostar_condition_MNT_indenpendence]\n- [mostar_condition_MNT_new_territory]\n- [mostar_condition_MNT_arms_import]\n\n\n- [mostar_condition_OTO_deport_mirko_petrovic_njegos_M]\n-[mostar_condition_OTO_protect_muslim_landlords_M]\n- [mostar_condition_OTO_demand_debt_repayment]"
 OTO_battleofgrahovac.24.t:0 "Results of the Mostar Negotiations"
 OTO_battleofgrahovac.25.a:0 "They don't know what they are talking about."
 OTO_battleofgrahovac.25.d:0 "Our Ministry of Foreign Affairs got an official statement from [who_make_diplomatic_presure]. In the statement, they are accusing us of starting a war, creating international pressure etc. On the top, they condemn our actions as acts of barbarism and insult us as an uncivilized nation."
 OTO_battleofgrahovac.25.t:0 "[who_make_diplomatic_presure] Diplomatically Pressures Us"
 OTO_battleofgrahovac.26.a:0 "Montenegro would still be our puppet. No matter what happens."
 OTO_battleofgrahovac.26.b:0 "We don't care that much. Let's give them a better counteroffer."
 OTO_battleofgrahovac.26.d:0 "Today, Montenegro has decided to give up its claim to independence and is willing to submit to the Sultan authority if we accept their concession on self-ruling autonomy. By this, we will still be sovereign over the territory of Montenegro, but Montenegro will gain some greater influence over their domestic and regional affairs."
 OTO_battleofgrahovac.26.t:0 "Montenegro Will Recognise Our Superiority"
 OTO_battleofgrahovac.27.a:0 "We accept their offer."
 OTO_battleofgrahovac.27.b:0 "[ottoman_better_offer_i]"
 OTO_battleofgrahovac.27.d:0 "Ottomans don't care so much about overlordship over our territories. That's why they decided to discount the item of independence for us. That left us with two options. The first one is to accept the offer and buy the independence cheaper. The second one is to refuse and get the two points, although we will have to give up our independence and continue being vassals of the sultan."
 OTO_battleofgrahovac.27.t:0 "Ottomans Offers Counteroffer"
 OTO_battleofgrahovac.28.a:0 "We gain §L2§! £negotiations_texticon ."
 OTO_battleofgrahovac.28.d:0 "The Ottomans listened to our views and openly welcomed our relinquishment of independence claims. In reaction to this, they invited our declaration to the Sultan. This act of internal recognition can improve our position on the international stage."
 OTO_battleofgrahovac.28.t:0 "Request approved"
 OTO_battleofgrahovac.29.a:0 "We acknowledge their stance."
 OTO_battleofgrahovac.29.b:0 "We don't care that much. Let's give them a better counteroffer."
 OTO_battleofgrahovac.29.d:0 "Today, Montenegro has decided to give up its claim to claims to new territories if we accept their concession on territorial integrity of their lands."
 OTO_battleofgrahovac.29.t:0 "Montenegro Refuses Territorial Expansion"
 OTO_battleofgrahovac.30.a:0 "We accept their offer."
 OTO_battleofgrahovac.30.b:0 "[ottoman_better_offer_t]"
 OTO_battleofgrahovac.30.d:0 "Ottomans don't care so much about our claims to new territories. That's why they decided to discount the item of Territorial Expansion for us. That left us with two options. The first one is to accept the offer and buy the Territorial Expansion cheaply. The second one is to refuse and get the two points, although we would have to give up our Territorial Expansion in this engagement."
 OTO_battleofgrahovac.30.t:0 "Ottomans Offers Counteroffer"
 OTO_battleofgrahovac.31.a:0 "We gain §L3§! £negotiations_texticon ."
 OTO_battleofgrahovac.31.d:0 "The Ottomans listened to our views and openly welcomed our relinquishment of claims to new territory. In reaction to this, they invited our declaration to the Sultan. This act of internal recognition can improve our position on the international stage."
 OTO_battleofgrahovac.31.t:0 "Request approved"
 OTO_battleofgrahovac.32.a:0 "We don't have another option than to defend our stances. To arms."
 OTO_battleofgrahovac.32.d:0 "Hopes of Mostar are still in our recent memories. But as negotiations had broken down, we needed to adapt to our new situation. In this situation, we need to gather adequate force to bring our enemies back to the negotiation table, but now under our terms."
 OTO_battleofgrahovac.32.t:0 "War is Here"
 OTO_battleofgrahovac.33.a:0 "Great news in these uncertain times."
 OTO_battleofgrahovac.33.d:0 "Unexpected comes into truth. There is a consensus between delegations in Mostar. Today, we got the news that both sides are willing to sign the results of the Mostar negotiations. This will surely bring much-needed stability to the region."
 OTO_battleofgrahovac.33.t:0 "Success of Negotiations"
 OTO_battleofgrahovac.34.a:0 "Truly interesting development."
 OTO_battleofgrahovac.34.d:0 "As mist and fog disappear from battlefields, it starts to be clear who was on top in this clash. After a short but bloody confrontation, Montenegro is a clear winner. We can only predict what will happen next. We can only predict if it will be a new agreement dictated by Montenegro."
 OTO_battleofgrahovac.34.t:0 "Montenegro Wins"
 OTO_battleofgrahovac.35.a:0 "Truly interesting development."
 OTO_battleofgrahovac.35.d:0 "As mist and fog disappear from battlefields, it starts to be clear who was on top in this clash. After a short but bloody confrontation, the Ottomans are a clear winner. We can only predict what will happen next. We can only predict if it will be a new agreement dictated by the Ottoman Empire."
 OTO_battleofgrahovac.35.t:0 "Ottomans Wins"
 OTO_battleofgrahovac.36.a:0 "Withdraw some of them, but we need to crush them."
 OTO_battleofgrahovac.36.d:0 "Today, one of our advisors suggested that our troops' concentration in the western Balkan to crush the uprising in Montenegro can raise the attention of great powers. It is in our best interests to withdraw at least some of our forces to calm down some great powers' attention."
 OTO_battleofgrahovac.36.t:0 "Risking to Break Balance of Powers in Western Balkan"
 OTO_battleofgrahovac.37.a:0 "Ok, withdraw some of them, and quickly."
 OTO_battleofgrahovac.37.d:0 "Today, we got the official diplomatic note about the situation in Montenegro. To our disadvantage, we gained unneeded attention for our actions in western Balkan. They are threatening us with their full intervention if we don't withdraw at least some of our troops from the region. Invasion from them would be the last thing we need in our situation."
 OTO_battleofgrahovac.37.t:0 "Balance of Powers in Western Balkan at Breaking Point"
 OTO_battleofgrahovac.38.a:0 "Let's watch the sea if they are coming."
 OTO_battleofgrahovac.38.d:0 "After our noncompliance with diplomatic notes from great powers, they intervened against us. This meant that their ambassadors were recalled back home, and the possible threat of invasion is increasing day by day. Our army is on high alert, and everyone in the empire is waiting for what will happen next."
 OTO_battleofgrahovac.38.t:0 "Great Powers Intervention in Western Balkan"
 OTO_battleofgrahovac.39.a:0 "We'd rather stay neutral to avoid escalation."
 OTO_battleofgrahovac.39.b:0 "We would support Montenegro."
 OTO_battleofgrahovac.39.c:0 "We would support the Ottoman Empire."
 OTO_battleofgrahovac.39.d:0 "After the failure of the negotiations in Mostar, both sides had taken up arms. The Ottoman Empire had sent its troops to the borders of Montenegro. This was done to establish its rule in the region it considers as its territory. But this is a risky move because too large an army could provoke a wider uprising of other nations in the unstable Balkan. This could also escalate the situation between the great powers, which aren't keen on the possible breaking of regional stability and the European concert of nations."
 OTO_battleofgrahovac.39.e:0 "We'd rather become neutral to avoid escalation."
 OTO_battleofgrahovac.39.f:0 "We'd rather become neutral to avoid escalation."
 OTO_battleofgrahovac.39.g:0 "We would put diplomatic pressure on the Ottoman Empire."
 OTO_battleofgrahovac.39.h:0 "We would put diplomatic pressure on the Montenegro."
 OTO_battleofgrahovac.39.t:0 "Montenegrin - Ottoman War"
 OTO_battleofgrahovac.40.a:0 "We need to watch them carefully."
 OTO_battleofgrahovac.40.d:0 "Our consul in the Ottoman Empire sent us a telegram. He got pieces of information leaked about the Ottoman army movement. It says that big army groups are forming in the western Balkan, somewhere near Montenegro. We need to watch it closely because it could break the regional balance of power and drag it to another great war."
 OTO_battleofgrahovac.40.t:0 "Ottoman Army Gathering in the Western Balkan"
 OTO_battleofgrahovac.41.a:0 "We must intervene to protect our interests."
 OTO_battleofgrahovac.41.d:0 "After sending an ultimatum about some troops withdrawing from the western Balkan, which got no response, we are forced to send our official declaration of war and start to form expeditionary forces, which will strike in our interest."
 OTO_battleofgrahovac.41.t:0 "Ottomans Crossed the Line"
 OTO_battleofgrahovac.42.a:0 "Interesting development."
 OTO_battleofgrahovac.42.d:0 "Today, we've got an important message from our commanding officers of Balkan expeditionary forces. It says that our ground troops had managed to win against the Ottoman army. This means that they are now willing to continue negotiations under our supervision."
 OTO_battleofgrahovac.42.t:0 "Victory of Great Powers Intervention"
 OTO_battleofgrahovac.43.a:0 "Great news."
 OTO_battleofgrahovac.43.d:0 "The Ottoman Empire suffered a huge defeat in the events of the Montenegrin rebellion. They found support in the great powers. [who_win_war] intervened to further the interests of the Prince of Montenegro by invading the Ottoman Empire. War ended victoriously for Montenegro. The war would result in the expansion of Montenegro's borders and the change of its status to "de facto" independence."
 OTO_battleofgrahovac.43.t:0 "End of Montenegrin Crisis"
 OTO_battleofgrahovac.44.a:0 "Let's hope we gain more than we lost."
 OTO_battleofgrahovac.44.d:0 "Our actions in the Montenegrin crisis may have brought us gains or losses. This would be counted and added to respective countries according to their moves."
 OTO_battleofgrahovac.44.t:0 "End of Montenegrin Crisis - Receiving Bonuses"
 OTO_battleofgrahovac.49.a:0 "We will make concessions to avoid humiliation."
 OTO_battleofgrahovac.49.b:0 "Do nothing, they are only bluffing."
 OTO_battleofgrahovac.49.c:0 "Let them come. We would be prepared for them."
 OTO_battleofgrahovac.49.d:0 "A group of French ships emerge right before the Albanian port city of Durrës. They sent us and primarily the port garrison last chance to save themselves. That last chance was an ultimatum to withdraw some of the force fighting Montenegro. We have only a few hours to answer till they start to fire and landing operation."
 OTO_battleofgrahovac.49.t:0 "French Invasion of Albania"
 OTO_battleofgrahovac.50.a:0 "We will make concessions to avoid humiliation."
 OTO_battleofgrahovac.50.b:0 "Do nothing, they are only bluffing."
 OTO_battleofgrahovac.50.c:0 "Let them come. We would be prepared for them."
 OTO_battleofgrahovac.50.d:0 "We have spotted mass Russian troops buildup on our borders in Balkan. They are threatening our Balkan possessions with a grand land invasion. They sent us and primarily the border garrison last chance to save themselves. That last chance was an ultimatum to withdraw some of the force fighting Montenegro. We have only a few hours to answer till they start another land invasion of our lands."
 OTO_battleofgrahovac.50.t:0 "Russian Invasion of Moldavia"
 OTO_battleofgrahovac.51.a:0 "Truly great news."
 OTO_battleofgrahovac.51.d:0 "Ottomans backed down in the face of imminent invasion, which would bring them a humiliating defeat. Now, they are willing to make concessions to keep us out of confrontation."
 OTO_battleofgrahovac.51.t:0 "Ottomans Make Concessions"
 OTO_battleofgrahovac.52.a:0 "Truly great news."
 OTO_battleofgrahovac.52.d:0 ""
 OTO_battleofgrahovac.52.t:0 "Montenegro Crisis Calmed Down"
 OTO_battleofgrahovac.54.a:0 "we'll sell them rifles"
