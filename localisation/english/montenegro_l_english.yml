 MNT_mechanised_agriculture1:0 "Expanding Mechanization of Agriculture"
 MNT_mechanised_agriculture1_desc:0 "Another shipment of new agricultural equipment arrived in our lands. With our distribution among farmers finishing we could say that it's great success. This will not only improve our yields from fields, but also improve lives of many of our people mainly farmers."
