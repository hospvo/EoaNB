 MNT_clans_cooperation_desc:0 " "
 MNT_clans_demobilize_tt:0 "§YStand down the clan levies§!\nRemoves only the dedicated small, medium and large clan levy divisions and the mobilization bonus. Regular troops and rebel formations are unaffected.\n§YRequires peace.§! A new war permits a fresh call to the clans."
