 # LIMITED WAR, OBJECTIVES AND RESULTS
 MNT_frontier.1.a:0 "Open the war dossier."
 MNT_frontier.1.a_tt:0 "The war panel tracks resolve, objectives, troops and foreign pressure. This button grants no extra units."
 MNT_frontier.1.d:0 "The uprising has become a limited war. Fight with real divisions on the map and follow Our Resolve, Ottoman Resolve and Time Left in Decisions.\n\n$MNT_frontier_war_rules_event$"
 MNT_frontier.1.t:0 "The Frontier War"
 MNT_frontier.2.a:0 "Demand restraint."
 MNT_frontier.2.b:0 "Keep watching."
 MNT_frontier.2.d:0 "Reports of Ottoman reinforcements and renewed fighting have reached our diplomats. We can press for restraint or watch the conflict for now.\n\nA protest adds pressure; it does not commit our army."
 MNT_frontier.2.t:0 "The Frontier Draws Attention"
 MNT_frontier.3.a:0 "Accept the ceasefire."
 MNT_frontier.3.b:0 "Press on."
 MNT_frontier.3.b_tt:0 "[OTO.GetFlag] Resolve §R-1§!; stability §R-3%§!.\nForeign pressure §Y+10§!. If Ottoman resolve reaches 0, Montenegro wins."
 MNT_frontier.3.d:0 "Foreign pressure has reached 75. Our diplomats warn that more fighting could cost us their support. We can accept a ceasefire or press on at a political cost.\n\nCeasefire: no new borders; Montenegro keeps self-rule.\n§RPress on:§! Ottoman resolve -1, stability -3%, pressure +10."
 MNT_frontier.3.t:0 "A Demand to Stop the Fighting"
 MNT_frontier.4.a:0 "Accept. End the fighting."
 MNT_frontier.4.b:0 "Refuse. Keep fighting."
 MNT_frontier.4.b_tt:0 "The offer is rejected. Resolve, borders and pressure do not change."
 MNT_frontier.4.d:0 "The other side offers to stop the fighting.\n\n- Both sides keep their prewar land.\n- Montenegro keeps self-rule.\n- No arms rights or formal recognition.\n- The temporary cordon is lifted.\n\nWe can accept, or keep fighting under the current rules."
 MNT_frontier.4.t:0 "A Ceasefire Offer"
 MNT_frontier.5.a:0 "Close the report."
 MNT_frontier.5.t:0 "[MNTfrontierResultTitle]"
 MNT_frontier.7.t:0 "War Rules & Rewards"
 MNT_frontier_actions:0 "Enemy losses: over §Y3,000§! gives §R-1 Ottoman Resolve§! once."
 MNT_frontier_appeal:0 "Appeal to Europe"
 MNT_frontier_appeal_tt:0 "[MNT.GetFlag] §Y20 political power§! | 28-day cooldown.\n§Y+10 foreign pressure§!. At 40 the great powers can protest; at 75 the Ottomans face an ultimatum."
 MNT_frontier_capital:0 "§YDefend Cetinje§! — its fall means §RMostar Convention§!."
 MNT_frontier_capital_tt:0 "§YDefend Cetinje§!\nKeep control of Inner Montenegro. Ottoman control of this state or Montenegrin capitulation ends the limited war in defeat at the next daily check."
 MNT_frontier_card_short_title:0 "GARRISON"
 MNT_frontier_card_short_value:0 "§Y[?OTO.MNT_frontier_garrison|0] / [?OTO.MNT_frontier_garrison_limit|0]§!"
 MNT_frontier_card_title:0 "OTTOMAN GARRISON"
 MNT_frontier_card_value:0 "§Y[?OTO.MNT_frontier_garrison|0] / [?OTO.MNT_frontier_garrison_limit|0]§! detachments"
 MNT_frontier_clans:0 "Call Clan Levies"
 MNT_frontier_clans_tt:0 "[MNT.GetFlag] Call all eligible clans.\nRequires prepared levies, control of Cetinje and at least one available clan. Each clan can be called only once per mobilization."
 MNT_frontier_cordon:0 "[MNTfrontierCordon]"
 MNT_frontier_cordon_active:0 "§YCONTROLLED FRONTIER§!\nNorth Epirus - Macedonia - Pirot-Pcinja"
 MNT_frontier_cordon_suspended:0 "§RCORDON SUSPENDED§!\nThe Ottoman Empire is fighting another country."
 MNT_frontier_cordon_tt:0 "§YThe monitored cordon§!\nOttoman-owned and controlled states in this belt are demilitarized. Ottoman troops entering them are returned to the Ottoman capital at the daily check.\nThis is a daily restriction, not an instant division cap. Sea landings and troops already beyond the belt are counted in theatre; excess forces add pressure.\nRestrictions are lifted if the Ottomans fight another enemy. Original demilitarized zones are preserved when the campaign ends."
 MNT_frontier_draw_tt:0 "§YCeasefire§!\n- Both sides keep their prewar land.\n- Montenegro keeps self-rule.\n- No new recognition or arms rights.\n- The temporary cordon is lifted."
 MNT_frontier_garrison_card_tt:0 "[OTO.GetFlag] §YOTTOMAN GARRISON§!\n\nCommitted: §Y[?OTO.MNT_frontier_garrison|0] detachments§!\nRecruitment limit: §Y[?OTO.MNT_frontier_garrison_limit|0] detachments§!\n\nBefore war, these are planned forces. Each detachment deploys as §Yone division with two irregular battalions§! if war begins.\n\nOttoman command can add troops before or during the talks for §Y20 political power§! and §R+5 war tension§!. Planned troops can be withdrawn before war.\nDuring war, each extra detachment adds §R+12 foreign pressure§!. Losses do not lower the committed total or give free replacements. The war panel shows surviving map divisions separately."
 MNT_frontier_garrison_category:0 "Ottoman Frontier Garrison"
 MNT_frontier_garrison_help:0 "Ottoman command controls this garrison. At 6 or more, rebel strength falls by 2 extra points each week."
 MNT_frontier_garrison_summary:0 "[OTO.GetFlag] Committed: §Y[?OTO.MNT_frontier_garrison|0] / [?OTO.MNT_frontier_garrison_limit|0] detachments§!\nThese forces deploy on the map if war breaks out."
 MNT_frontier_garrison_title:0 "£MNT_treaty_arms_texticon£ FRONTIER GARRISON"
 MNT_frontier_garrison_tt:0 "§YThe Ottoman garrison§!\nStarts at 4 detachments. Each has two irregular infantry battalions.\nBefore war these are planned forces, not map divisions. At the outbreak, regular Ottoman troops in the limited theatre return to their capital and the planned garrison deploys.\nNew reinforcements are paid for separately. Lost detachments are not replaced for free."
 MNT_frontier_grahovo:0 "[MNTfrontierGrahovo]"
 MNT_frontier_grahovo_done:0 "§GGrahovo secured§! | Ottoman resolve -2 applied"
 MNT_frontier_grahovo_progress:0 "§YHold Grahovo — 20 Days§!   [?MNT.MNT_frontier_grahovo_days|0]/20"
 MNT_frontier_grahovo_tt:0 "§YHold Grahovo for 20 days§!\nLosing control before completion resets the timer. Completed objectives cannot be farmed again."
 MNT_frontier_mnt_label:0 "MONTENEGRIN RESOLVE"
 MNT_frontier_mnt_resolve:0 "[MNT.GetFlag] [MNTfrontierOurLabel]   §G[?MNT.available_lives|0] / 4§!"
 MNT_frontier_mostar:0 "[MNTfrontierMostar]"
 MNT_frontier_mostar_done:0 "§GMostar secured§! | Ottoman resolve -1 applied"
 MNT_frontier_mostar_progress:0 "§YHold Mostar — 30 Days§!   [?MNT.MNT_frontier_mostar_days|0]/30"
 MNT_frontier_mostar_tt:0 "§YHold Mostar for 30 days§!\nLosing control before completion resets the timer."
 MNT_frontier_no_change_tt:0 "No further changes."
 MNT_frontier_objectives_title:0 "£MNT_treaty_frontier_texticon£ MONTENEGRIN OBJECTIVES"
 MNT_frontier_observers:0 "Allow Observers"
 MNT_frontier_observers_tt:0 "[OTO.GetFlag] §Y15 political power§! | 21-day cooldown.\n§G-15 foreign pressure§!. Does not replace lost troops or restore resolve."
 MNT_frontier_oto_label:0 "OTTOMAN RESOLVE"
 MNT_frontier_oto_resolve:0 "[OTO.GetFlag] [MNTfrontierOttomanLabel]   §R[?OTO.available_lives|0] / 4§!"
 MNT_frontier_our_label:0 "OUR RESOLVE"
 MNT_frontier_outcome_hint:0 "§GVictory§!: Outer Montenegro. §Y200 days§!: Ceasefire.\n§R0 Resolve / Cetinje lost§!: Mostar Convention. Read Rules & Rewards below."
 MNT_frontier_peace:0 "Offer a Ceasefire"
 MNT_frontier_peace_tt:0 "Available after 30 days. Send a ceasefire offer to the other player.\nBoth sides keep their prewar land; Montenegro keeps self-rule. The other side can refuse. 30-day cooldown."
 MNT_frontier_pp_already_done:0 "- Settlement focus was already complete: no extra political power."
 MNT_frontier_pp_awarded:0 "- Settlement focus: §G+10 political power§!."
 MNT_frontier_pressure:0 "£MNT_crisis_diplomacy_texticon£ FOREIGN PRESSURE   §Y[?MNT.MNT_frontier_pressure|0] / 100§!"
 MNT_frontier_pressure_tt:0 "§YThe cost of escalation§!\nStarts at 10, plus 2 per level of prewar foreign backing.\nEach wartime reinforcement: +12 pressure.\nObserver access: -15 pressure for 15 political power, every 21 days.\nMontenegrin appeal: +10 pressure for 20 political power, every 28 days.\nAt 40, France, Russia and Austria can protest. At 75, the Ottomans face one ultimatum.\nTroops above the committed garrison: +15 pressure each week. Foreign armies never join automatically."
 MNT_frontier_protest:0 "Send a Protest"
 MNT_frontier_protest_tt:0 "§Y15 political power§! | Once per country.\n§Y+8 foreign pressure§!. Available to France, Russia and Austria at 40 pressure. Does not declare war."
 MNT_frontier_read_orders:0 "War Rules & Rewards"
 MNT_frontier_read_orders_desc:0 "§YLIMITED WAR: RULES & REWARDS§!\n\n§GVictory§! — Reduce Ottoman Resolve to 0.\n- Hold Grahovo for 20 days: Ottoman Resolve §R-2§!.\n- Hold Mostar for 30 days: Ottoman Resolve §R-1§!.\n- Cause over 3,000 Ottoman losses: Ottoman Resolve §R-1§!.\n- Reward: [MNT.GetFlag] Outer Montenegro if Ottoman-owned, with a 90-day troop ban and border commission. Montenegro keeps self-rule.\n\n§RMostar Convention§! — Cetinje falls, Montenegro capitulates, or Our Resolve reaches 0.\n- Our Resolve drops by 1 after each 1,000 losses, up to 4 drops (over 4,000 losses).\n- Result: Ottoman subject status, Mostar Convention spirit, §R-2.5% war support§!.\n\n§YCeasefire§! — After 200 days, an accepted peace offer, or an accepted foreign ultimatum.\n- No scripted border change; no new recognition or arms rights.\n- A held objective resets if lost before completion. Rewards apply once.\n- Clan levies can be called from the war panel. Foreign armies do not join automatically."
 MNT_frontier_reason_capital:0 "§YWhy it ended:§! Cetinje fell or Montenegro capitulated."
 MNT_frontier_reason_mnt_resolve:0 "§YWhy it ended:§! Montenegrin Resolve reached 0."
 MNT_frontier_reason_offer:0 "§YWhy it ended:§! Both sides accepted a ceasefire offer."
 MNT_frontier_reason_oto_resolve:0 "§YWhy it ended:§! Ottoman Resolve reached 0."
 MNT_frontier_reason_timeout:0 "§YWhy it ended:§! The 200-day limit was reached."
 MNT_frontier_reason_ultimatum:0 "§YWhy it ended:§! The Ottomans accepted the foreign ultimatum."
 MNT_frontier_reason_unknown:0 "§YWhy it ended:§! A limited-war settlement was recorded before cause tracking was added."
 MNT_frontier_recruit:0 "Send 1 Detachment"
 MNT_frontier_recruit_tt:0 "[OTO.GetFlag] §Y20 political power§! | 10-day cooldown.\nAdds one committed detachment, up to the current limit of §Y[?OTO.MNT_frontier_garrison_limit|0]§!.\nBefore war: §R+5 war tension§!. During war: deploys one map division and adds §R+12 foreign pressure§!.\nA detachment has two irregular infantry battalions. No free replacement after losses. A controlled staging state is required."
 MNT_frontier_reduce:0 "Reduce Garrison"
 MNT_frontier_reduce_tt:0 "[OTO.GetFlag] Remove one planned detachment before war, down to 2.\n§G-3 war tension§!. No political power refund. 10-day cooldown."
 MNT_frontier_resolve_tt:0 "§YBoth sides start with 4 Resolve§!\n[MNT.GetFlag] Lose 1 Resolve for each threshold of over 1,000 / 2,000 / 3,000 / 4,000 losses. At 0: Mostar Convention. The fall of Cetinje or capitulation also means defeat.\n[OTO.GetFlag] Lose 2 for Grahovo (20 days), 1 for Mostar (30 days), and 1 for over 3,000 Ottoman losses. At 0: Montenegrin Victory.\nHolding times must be consecutive. Each reward applies once."
 MNT_frontier_result:0 "[MNTfrontierResult]"
 MNT_frontier_result_defeat:0 "§RMOSTAR CONVENTION§!\n[MNTfrontierEndReason]\n\n£MNT_treaty_sovereignty_texticon£ [MNT.GetFlag] Becomes an Ottoman subject.\n- Gains the §YMostar Convention§! national spirit.\n- War support: §R-2.5%§!.\n- No new land, arms rights or recognition.\n- Temporary cordon lifted; Ottoman frontier detachments removed.\n- Clan levies stand down if no other war remains."
 MNT_frontier_result_draw:0 "§YCEASEFIRE§!\n[MNTfrontierEndReason]\n\n£MNT_treaty_sovereignty_texticon£ [MNT.GetFlag] Montenegro keeps self-rule.\n- No scripted border change.\n- No new arms rights or formal recognition.\n[MNTfrontierCeasefireReward]\n- Temporary cordon lifted; Ottoman frontier detachments removed.\n- Clan levies stand down if no other war remains."
 MNT_frontier_result_external:0 "§YSEPARATE PEACE§!\nFighting ended outside the limited-war rules.\n\n- The separate peace determines borders and subject status.\n- No second treaty is imposed.\n- Temporary cordon lifted; Ottoman frontier detachments removed."
 MNT_frontier_result_victory:0 "§GVICTORY§!\n[MNTfrontierEndReason]\n\n£MNT_treaty_sovereignty_texticon£ [MNT.GetFlag] Montenegro keeps self-rule.\n£MNT_treaty_frontier_texticon£ [MNT.GetFlag] Gains Outer Montenegro.\n- Troop ban in the new land: §Y90 days§!. A border commission follows.\n- Temporary cordon lifted; Ottoman frontier detachments removed.\n- Clan levies stand down if no other war remains.\n- No automatic arms rights or formal recognition."
 MNT_frontier_result_victory_no_border:0 "§GVICTORY§!\n[MNTfrontierEndReason]\n\n[MNT.GetFlag] Montenegro keeps self-rule.\n- No land transferred: Outer Montenegro was not Ottoman-owned.\n- Temporary cordon lifted; Ottoman frontier detachments removed.\n- Clan levies stand down if no other war remains.\n- No automatic arms rights or formal recognition."
 MNT_frontier_scutari_done:0 "§GScutari secured§! | Ottoman resolve -1 applied"
 MNT_frontier_scutari_progress:0 "§YHold Scutari§!  [?MNT.MNT_frontier_scutari_days|0]/30 days | Ottoman resolve §R-1§!"
 MNT_frontier_show:0 "Show"
 MNT_frontier_summary:0 "On map: §Y[?MNT.MNT_frontier_fielded|0] Ottoman divisions§!"
 MNT_frontier_time:0 "£time_texticon£ TIME LEFT   §Y[?MNT.MNT_frontier_left|0] / 200 days§!"
 MNT_frontier_time_tt:0 "§Y200-day limit§!\nIf neither side has lost when the daily count reaches 200, the war ends in a Ceasefire. Capital loss and Resolve defeat take priority on the same day."
 MNT_frontier_title:0 "§YHERZEGOVINA WAR§!"
 MNT_frontier_title_ceasefire:0 "Ceasefire"
 MNT_frontier_title_defeat:0 "Mostar Convention"
 MNT_frontier_title_external:0 "Separate Peace"
 MNT_frontier_title_victory:0 "Victory"
 MNT_frontier_war_record:0 "Review the War Result"
 MNT_frontier_war_record_desc:0 "Read the actual outcome of the frontier campaign."
 MNT_frontier_war_rules:0 "§YLIMITED WAR: RULES & REWARDS§!\n\n§GVictory§! — Reduce Ottoman Resolve to 0.\n- Hold Grahovo for 20 days: Ottoman Resolve §R-2§!.\n- Hold Mostar for 30 days: Ottoman Resolve §R-1§!.\n- Cause over 3,000 Ottoman losses: Ottoman Resolve §R-1§!.\n- Reward: [MNT.GetFlag] Outer Montenegro if Ottoman-owned, with a 90-day troop ban and border commission. Montenegro keeps self-rule.\n\n§RMostar Convention§! — Cetinje falls, Montenegro capitulates, or Our Resolve reaches 0.\n- Our Resolve drops by 1 after each 1,000 losses, up to 4 drops (over 4,000 losses).\n- Result: Ottoman subject status, Mostar Convention spirit, §R-2.5% war support§!.\n\n§YCeasefire§! — After 200 days, an accepted peace offer, or an accepted foreign ultimatum.\n- No scripted border change; no new recognition or arms rights.\n- A held objective resets if lost before completion. Rewards apply once.\n- Clan levies can be called from the war panel. Foreign armies do not join automatically."
 MNT_frontier_war_rules_event:0 "§OLIMITED WAR: RULES & REWARDS§!\n\n§OVictory§! — Reduce Ottoman Resolve to 0.\n- Hold Grahovo for 20 days: Ottoman Resolve §R-2§!.\n- Hold Mostar for 30 days: Ottoman Resolve §R-1§!.\n- Cause over 3,000 Ottoman losses: Ottoman Resolve §R-1§!.\n- Reward: [MNT.GetFlag] Outer Montenegro if Ottoman-owned, with a 90-day troop ban and border commission. Montenegro keeps self-rule.\n\n§RMostar Convention§! — Cetinje falls, Montenegro capitulates, or Our Resolve reaches 0.\n- Our Resolve drops by 1 after each 1,000 losses, up to 4 drops (over 4,000 losses).\n- Result: Ottoman subject status, Mostar Convention spirit, §R-2.5% war support§!.\n\n§OCeasefire§! — After 200 days, an accepted peace offer, or an accepted foreign ultimatum.\n- No scripted border change; no new recognition or arms rights.\n- A held objective resets if lost before completion. Rewards apply once.\n- Clan levies can be called from the war panel. Foreign armies do not join automatically."

 # DIPLOMACY, NEGOTIATORS AND CONTEXTUAL TOOLTIPS
 MNT_delegate_nikanor_austria_name:0 "£MNT_delegate_option_portraits|5£ Nikanor Ivanović"
 MNT_delegate_nikanor_austria_tt:0 "[GetMNTDiplomacyNikanorOption]\n[GetMNTSupportAustriaGain]\nRelations: £MNT_support_austria_up£ £MNT_support_france_down£ £MNT_support_russia_down£\n"
 MNT_delegate_nikanor_russia_name:0 "£MNT_delegate_option_portraits|6£ Nikanor Ivanović"
 MNT_delegate_nikanor_russia_tt:0 "[GetMNTDiplomacyNikanorOption]\n[GetMNTSupportRussiaGain]\nRelations: £MNT_support_russia_up£ £MNT_support_france_down£ £MNT_support_austria_down£\n"
 MNT_delegate_nikanor_secretary_name:0 "£MNT_delegate_option_portraits|2£ Nikanor Ivanović"
 MNT_diplomacy.1.a:0 "£MNT_support_russia_up£ Ask Russia to consecrate him."
 MNT_diplomacy.1.b:0 "£MNT_support_austria_up£ Send him to Karlovci."
 MNT_diplomacy.1.c:0 "Wait until a route is open."
 MNT_diplomacy.1.d:0 "Nikanor serves Danilo as secretary. Now the church needs a consecrated metropolitan. Who should help us fill the empty seat?\n\n£MNT_support_russia_up£ RUSSIA — Backing from the Orthodox court. Vienna will object.\n£MNT_support_austria_up£ AUSTRIA — Consecration at Karlovci. Petersburg will object.\n\nBoth choices: remove Missing Metropolitan, appoint Nikanor and gain §G2 percentage points§! of Humanitive Institution progress.\n\n§gThe historical Russian consecration took place in December 1858. Karlovci is an alternative path.§!"
 MNT_diplomacy.1.t:0 "A Metropolitan for Montenegro"
 MNT_diplomacy.2.d:0 "The prince must name a negotiator to speak for Montenegro. The chosen representative will lead our delegation for the whole conference."
 MNT_diplomacy.2.delarue:0 "£MNT_delegate_option_portraits|1£ Henri Delarue"
 MNT_diplomacy.2.mirko:0 "£MNT_delegate_option_portraits|3£ Mirko Petrović-Njegoš"
 MNT_diplomacy.2.nikanor:0 "[GetMNTDiplomacyNikanorOption]"
 MNT_diplomacy.2.t:0 "Choose Our Negotiator"
 MNT_diplomacy.2.vukalovic:0 "£MNT_delegate_option_portraits|4£ Luka Vukalović"
 MNT_diplomacy.3.a:0 "The uprising will hear of this."
 MNT_diplomacy.3.d:0 "The conference has ended in war. Ottoman officials have detained Luka Vukalović as a rebel against the sultan.\n\n- §RVukalović is in Ottoman custody.§! His council portrait now shows bars.\n- 6 volunteer divisions rally at Cetinje for this limited war.\n- He cannot become a Montenegrin commander while imprisoned.\n- His imprisonment remains unresolved after the war."
 MNT_diplomacy.3.t:0 "Vukalović Arrested"
 MNT_diplomacy.4.a:0 "Keep it quiet — accept two bands."
 MNT_diplomacy.4.d:0 "Herzegovinian bands are ready to cross the frontier. We can admit a small force quietly, or openly invite an uprising leader and a larger force.\n\nChoose once for this war. Open support will anger the powers, especially Austria. A binding non-intervention pledge blocks acceptance until it is openly broken.\n\nThe volunteers are temporary; their recruited commander remains in our service."
 MNT_diplomacy.4.ljubibratic:0 "Call Mićo Ljubibratić and four bands."
 MNT_diplomacy.4.luka:0 "Call Luka Vukalović and four bands."
 MNT_diplomacy.4.no:0 "Keep the rebels outside our army."
 MNT_diplomacy.4.t:0 "The Rebels Offer to Join"
 MNT_diplomacy.4.zimonjic:0 "Call Bogdan Zimonjić and four bands."
 MNT_diplomacy.5.a:0 "Let them defend the frontier."
 MNT_diplomacy.5.d:0 "News of Luka’s arrest has reached the border villages. Six volunteer bands have rallied at Cetinje.\n\n- 6 temporary divisions, one irregular battalion each.\n- Vukalović remains imprisoned and cannot lead them.\n- This replaces the ordinary two-or-four-division offer; the rewards do not stack.\n- The bands return home after this limited war."
 MNT_diplomacy.5.t:0 "Rally for Vukalović"
 MNT_diplomacy.6.a:0 "Close the report."
 MNT_diplomacy.6.d:0 "§RLuka Vukalović is imprisoned.§!\n\nHe cannot attend the council, negotiate again or join Montenegro’s officer corps. Supplies can still be sent through other contacts, but Luka’s personal delivery action is unavailable. His fate will need a later settlement.\n\nRebel trust remains the same shared value used by the uprising."
 MNT_diplomacy.6.t:0 "Luka Is in Ottoman Custody"
 MNT_diplomacy.7.a:0 "We need a new chancellor."
 MNT_diplomacy.7.d:0 "One hundred and twenty days have passed since the final settlement, or the boundary commission where required. Henri Delarue has left the prince’s service and returned to France.\n\n£MNT_delarue_french_texticon£ Delarue leaves the cabinet. His advisor bonuses end.\n£MNT_missing_chancellor_texticon£ Gain Missing Chancellor: daily political power §R−0.05§!.\n\nThe signed agreement and the conference’s diplomatic effects stay in place."
 MNT_diplomacy.7.t:0 "Delarue Returns to France"
 MNT_diplomacy.8.a:0 "Back to the talks."
 MNT_diplomacy.8.d:0 "[GetMNTDiplomacyDelegate]\n\n[GetMNTDiplomacyEnvoyRecord]"
 MNT_diplomacy.8.t:0 "Our Negotiator"
 MNT_diplomacy_austrian_tt:0 "£MNT_nikanor_austrian_metropolitan_texticon£ §YNikanor becomes Metropolitan§!\nMissing Metropolitan removed.\nHumanitive Institution: §G+2 percentage points§!.\n[GetMNTSupportAustriaGain]\n[GetMNTSupportRussiaLoss]\nRelations: £MNT_support_austria_up£ £MNT_support_russia_down£\n"
 MNT_diplomacy_call_ljubibratic_tt:0 "§YMićo Ljubibratić§! joins our army.\nRebel divisions: §G+4§! at Cetinje.\nRebel trust: §G+8§!.\nReputation: §R-8§!.\n[GetMNTSupportAustriaLoss]\nRelations: £MNT_support_france_down£ £MNT_support_russia_down£ £MNT_support_austria_down£\nDivisions leave after the war.\nInexperienced commander."
 MNT_diplomacy_call_luka_tt:0 "§YLuka Vukalović§! joins our army.\nRebel divisions: §G+4§! at Cetinje.\nRebel trust: §G+8§!.\nReputation: §R-8§!.\n[GetMNTSupportAustriaLoss]\nRelations: £MNT_support_france_down£ £MNT_support_russia_down£ £MNT_support_austria_down£\nDivisions leave after the war."
 MNT_diplomacy_call_zimonjic_tt:0 "§YBogdan Zimonjić§! joins our army.\nRebel divisions: §G+4§! at Cetinje.\nRebel trust: §G+8§!.\nReputation: §R-8§!.\n[GetMNTSupportAustriaLoss]\nRelations: £MNT_support_france_down£ £MNT_support_russia_down£ £MNT_support_austria_down£\nDivisions leave after the war."
 MNT_diplomacy_captains_delegate:0 "The Captains at the Table"
 MNT_diplomacy_consecration:0 "Choose Nikanor’s Place of Consecration"
 MNT_diplomacy_consecration_desc:0 "Reopen the completed focus’s choice after waiting for a safe route. No second Foreign Policy Point is spent."
 MNT_diplomacy_consecration_friend:0 "Our Church Connection"
 MNT_diplomacy_consecration_rival:0 "A Rival Consecrated Their Metropolitan"
 MNT_diplomacy_debug_consecration:0 "DEBUG: Preview Nikanor’s Consecration"
 MNT_diplomacy_debug_consecration_desc:0 "Open the real consecration event without waiting for the focus or charging a Foreign Policy Point. Choices really change the advisor, national spirit and diplomatic opinion. Use a separate test save; this does not reset a completed consecration."
