 # FOOD, DOMESTIC POLICY AND THE 1857-1860 CAMPAIGN
 MNT_state.2.a:0 "Open the food account."
 MNT_state.2.d:0 "The village stores are nearly empty. Families ask why the prince forbids raids while failing to feed them.\n\n- Food below 10 adds 6 unrest each month.\n- A raid ban adds another 4 while food is low.\n- Domestic clan loyalty has fallen by one level. This warning can return after 90 days.\n\nBuy food in Kotor, build stores, or cut rations. No raid starts from this event."
 MNT_state.2.t:0 "Bread Before Promises"
 MNT_state.3.a:0 "The state will pay for service."
 MNT_state.3.b:0 "Hear the clan heads first."
 MNT_state.3.d:0 "Promises made at the negotiating table have reached the villages. The captains ask who will feed their men if raids and plunder are restricted."
 MNT_state.3.t:0 "The Captains Want an Answer"
 MNT_state.4.a:0 "We need money for the next payment."
 MNT_state.4.d:0 "The treasury could not pay £currency_texticons|2 5,000 this month. The patrols remain on the books, but missed pay adds 4 unrest each month. Payment resumes automatically when the money is available. The raid ban remains in force."
 MNT_state.4.t:0 "The Patrol Pay Is Missing"
 MNT_state.5.a:0 "Pay for a public settlement."
 MNT_state.5.b:0 "The prince’s word is enough."
 MNT_state.5.d:0 "A settlement can bring hostile families back into public life. It will cost the prince both money and authority. Forcing obedience is quicker, but leaves the old anger alive."
 MNT_state.5.t:0 "Old Feuds Before the Court"
 MNT_state.6.a:0 "Send food and keep our word."
 MNT_state.6.b:0 "Our own villages come first."
 MNT_state.6.d:0 "Luka Vukalović asks what our partnership will mean after the next settlement. Helping his villages costs food; standing aside protects our own stores."
 MNT_state.6.t:0 "Montenegro and the Rebels"
 MNT_state.10.a:0 "Send the promised help."
 MNT_state.10.b:0 "We cannot help now."
 MNT_state.10.d:0 "Cetinje asks France for help. We can spend £currency_texticons|2 20,000 and 15 political power to support Montenegro. We will not enter its wars.\n\nAcceptance raises our support in the Herzegovina crisis by one level (maximum 3). A refusal sends nothing."
 MNT_state.10.t:0 "A Request from Montenegro"
 MNT_state.11.a:0 "Send the promised help."
 MNT_state.11.b:0 "We cannot help now."
 MNT_state.11.d:0 "Cetinje asks Russia for help. We can spend 100 rifles and 15 political power to support Montenegro. We will not enter its wars.\n\nAcceptance raises our support in the Herzegovina crisis by one level (maximum 3). A refusal sends nothing."
 MNT_state.11.t:0 "A Request from Montenegro"
 MNT_state.12.a:0 "Send the promised help."
 MNT_state.12.b:0 "We cannot help now."
 MNT_state.12.d:0 "Cetinje asks Austria for help. We can spend 15 political power to support Montenegro. We will not enter its wars.\n\nAcceptance raises our support in the Herzegovina crisis by one level (maximum 3). A refusal sends nothing."
 MNT_state.12.t:0 "A Request from Montenegro"
 MNT_state.13.a:0 "Stand with Paris."
 MNT_state.13.b:0 "Protect our Austrian trade."
 MNT_state.13.c:0 "Stay neutral."
 MNT_state.13.d:0 "The struggle over Italy makes our choice of friends more costly. A statement of support may help one relationship and hurt another. This choice is about our position; it does not start a new war."
 MNT_state.13.t:0 "France and Austria Face Each Other"
 MNT_state.14.a:0 "Put the help to use."
 MNT_state.14.d:0 "The requested help has arrived.\n\n[GetMNTStateAidSummary]\n\nWe have received support, not a promise of military intervention."
 MNT_state.14.t:0 "Our Request Was Accepted"
 MNT_state.15.a:0 "We must work with what we have."
 MNT_state.15.d:0 "The foreign court has refused our request.\n\n- No money, rifles or food arrives.\n- No support level is gained.\n- The Foreign Policy Point used for the mission remains spent."
 MNT_state.15.t:0 "Our Request Was Refused"
 MNT_state.19.a:0 "Review the prince’s safety."
 MNT_state.19.d:0 "The prince plans to visit Kotor in August. Old disputes make a public visit risky.\n\n- Complete §OGuard the Prince§! to open a safe escort.\n- The escort currently costs §O£currency_texticons|2 [?MNT_state_guard_price_k|0]K§!.\n- At 60 unrest or more, the guard costs more. A feud settlement lowers the price.\n- Postponing the visit will always remain an option.\n\nThe danger will be resolved on or after 13 August."
 MNT_state.19.t:0 "Danilo Plans a Visit to Kotor"
 MNT_state.20.a:0 "Pay for a protected visit."
 MNT_state.20.b:0 "Postpone the visit."
 MNT_state.20.c:0 "Travel as planned."
 MNT_state.20.d:0 "Danilo is ready to leave. The choice is ours. A protected visit or a postponed trip will keep him alive in this chapter. An ordinary visit leaves him exposed.\n\n[GetMNTStateTripRisk]\n\nA paid escort requires §OGuard the Prince§!. Its current price is §O£currency_texticons|2 [?MNT_state_guard_price_k|0]K§!."
 MNT_state.20.t:0 "The Road to Kotor"
 MNT_state.21.a:0 "There is more work to do."
 MNT_state.21.d:0 "The prince has survived the danger around the planned visit.\n\n- Danilo remains ruler.\n- Nikola does not take the throne.\n- Food, clan relations and foreign support keep their current values.\n- The assassination chain is closed for this campaign.\n\nHis future will depend on the country he has built."
 MNT_state.21.t:0 "Danilo Lives"
 MNT_state.22.a:0 "Long live Prince Nikola."
 MNT_state.22.d:0 "Danilo has been killed. Nikola succeeds him as prince.\n\n- Nikola I becomes ruler.\n- Stability falls by 5%.\n- Food, clan relations, treaties and foreign support carry over.\n- The assassination chain is closed.\n\nA new prince inherits every promise made by the old one."
 MNT_state.22.t:0 "The Death of Danilo"
 MNT_state.30.a:0 "Send 25 rifles."
 MNT_state.30.b:0 "Return to the council."
 MNT_state.30.d:0 "The uprising needs a partner in Cetinje. Luka values supplies and respect for local command.\n\n- Shared rebel trust: [?MNT_crisis_vukalovic_trust|0]/100\n- Rifle deliveries cost 25 rifles and add 8 trust.\n- Quiet-border agreements may help Montenegro while disappointing the rebels.\n\nThis council keeps the same trust account as the Herzegovina crisis."
 MNT_state.30.t:0 "Luka Vukalović"
 MNT_state.31.a:0 "Keep the route open."
 MNT_state.31.d:0 "Zimonjić is a local leader in Herzegovina. Couriers can keep his part of the uprising in contact with Cetinje.\n\n- Complete Couriers to Zimonjić: trust +8, clan unrest -3.\n- This is a one-time reward.\n- The council shares Vukalović’s trust account."
 MNT_state.31.t:0 "Bogdan Zimonjić"
 MNT_state.32.a:0 "Keep the reports coming."
 MNT_state.32.d:0 "Ljubibratić serves as Vukalović’s secretary. Reports and letters help the prince follow the uprising and explain its case abroad.\n\n- Complete A Desk for Ljubibratić: trust +5 and one Foreign Policy Point.\n- This is a one-time reward.\n- His role is political and administrative."
 MNT_state.32.t:0 "Mićo Ljubibratić"
 MNT_state_agriculture:0 "State Agriculture"
 MNT_state_agriculture_desc:0 "Why should we partition our newly gained lands, when it was mainly our effort in gaining them. We left this land for us and we are managing through our loyal administrators."
 MNT_state_aid_austria:0 "- The Kotor route brought 20 food.\n£MNT_support_austria_up£ Austrian support: [?MNT.MNT_crisis_austria|0]/3."
 MNT_state_aid_france:0 "- France sent £currency_texticons|2 20,000.\n£MNT_support_france_up£ French support: [?MNT.MNT_crisis_france|0]/3."
 MNT_state_aid_russia:0 "- Russia sent 100 rifles.\n£MNT_support_russia_up£ Russian support: [?MNT.MNT_crisis_russia|0]/3."
 MNT_state_aid_unknown:0 "- The requested aid was delivered.\n- The answering power’s support rose by 1, up to 3."
 MNT_state_appoint_vaclik:0 "Appoint Jan Vaclík"
 MNT_state_appoint_vaclik_desc:0 "Delarue has returned to France. Appoint Jan Vaclík as our new chancellor. Remove Missing Chancellor and activate Vaclík as an advisor: daily political power +0.10."
 MNT_state_army_value:0 "Central army: §Y[?MNT.MNT_state_centralization|0]/100§!   |   0 = clan command, 100 = state command"
 MNT_state_associate_active:0 "§GContact established§!"
 MNT_state_associate_waiting:0 "Build ties through the focuses below."
 MNT_state_austria_value:0 "§Y[AUS.GetFlag] Austria§!: [?MNT.MNT_crisis_austria|0]/3 support"
 MNT_state_austrian_border:0 "Give Vienna a Quiet Border"
 MNT_state_austrian_border_desc:0 "Foreign Policy Points: §R-1§!.\n[GetMNTSupportAustriaGain]\nReputation: §G+8§!.\nRebel trust: §R-6§!.\n[GetMNTRaidBanCost]"
 MNT_state_austrian_border_result_tt:0 "Foreign Policy Points: §R-1§!.\n[GetMNTSupportAustriaGain]\nReputation: §G+8§!.\nRebel trust: §R-6§!.\n[GetMNTRaidBanCost]"
 MNT_state_axes_tt:0 "§YThe prince’s direction§!\nAt 50 central army: organization +3%, planning speed +5%.\nWith a Clan Compact and central army at 20 or below: army defence +3%.\nAt 60 modernity: daily political power +0.10.\nAt 30 modernity or below: clan unrest -1 each month.\nBonuses update as the values change. State Service or the Clan Compact also opens wartime clan mobilization. Individual clan loyalty still decides who answers the call."
 MNT_state_ban_off:0 "Clan raids are not banned by state policy.\nThis chapter does not launch raids or border wars."
 MNT_state_ban_on:0 "§YRaid ban in force§!\nHungry clans expect food or paid work in return."
 MNT_state_ban_value:0 "[GetMNTStateBan]"
 MNT_state_buy_food_button:0 "Buy 24 Food"
 MNT_state_buy_food_tt:0 "§YBuy food from Kotor merchants§!\nPay the listed price from the national treasury. Receive 24 food.\nRequires room for the full delivery and peace with Austria. Cooldown: 30 days.\nNo political power cost."
 MNT_state_captains_council:0 "Call the Captains"
 MNT_state_captains_council_desc:0 "The prince needs the clans, but the clans expect to keep their rights. Bring promises made abroad before a council at home."
 MNT_state_central_command:0 "Central Army Command"
 MNT_state_central_command_desc:0 "At least 50 central army: organization +3% and planning speed +5%. The bonus ends if central army falls below 50."
 MNT_state_clan_compact:0 "Keep the Clan Compact"
 MNT_state_clan_compact_desc:0 "Leave command with the clan heads. Central army -10, modernity -5, clan unrest -12. Domestic clans gain one loyalty level."
 MNT_state_clan_compact_result_tt:0 "Central army: §Y-10§!\nModernity: §Y-5§!\n£stability_texticon£ Clan unrest: §G-12§!\nDomestic clan loyalty: §G+1 level§!"
 MNT_state_clan_courts:0 "Let the Clans Be Heard"
 MNT_state_clan_courts_desc:0 "Give clan courts a formal place in the state. Unrest -8, central army -5. This protects local authority without cancelling our treaties."
 MNT_state_clan_courts_result_tt:0 "£stability_texticon£ Clan unrest: §G-8§!\nCentral army: §Y-5§!"
 MNT_state_clan_defence:0 "Clan Defence Pact"
 MNT_state_clan_defence_desc:0 "The Clan Compact, with central army at 20 or below: army defence +3%. The bonus ends above 20 central army."
 MNT_state_clans_title:0 "§YPRINCE AND CLANS§!"
 MNT_state_compensate:0 "Pay the Captains"
 MNT_state_compensate_desc:0 "Pay §Y£currency_texticons|2 10,000§! and 15 political power. Clan unrest §G-8§!. Domestic clans gain §Gone loyalty level§!. Does not lift the raid ban."
 MNT_state_council_clans_tt:0 "Clan unrest §G-5§!; central army §R-5§!."
 MNT_state_council_rifles_tt:0 "£MNT_crisis_strength_texticon£ Rifles §R-25§!; rebel trust §G+8§!.\nDuring the covert phase: rebel supplies §G+14 days§!, tension §R+3§!.\n45-day delivery cooldown. Blocked by an active non-intervention promise."
 MNT_state_council_state_tt:0 "Central army §G+10§!; clan unrest §R+5§!."
 MNT_state_council_tt:0 "The council shares Vukalović’s existing trust value. Zimonjić’s couriers and Ljubibratić’s reports open through their focuses. A fourth seat is reserved for later content.\nRifle deliveries cost 25 rifles and give +8 trust every 45 days until 1861."
 MNT_state_debug:0 "DEBUG: Montenegro 1857–60"
 MNT_state_debug_council:0 "DEBUG: Open Vukalović’s Profile"
 MNT_state_debug_council_desc:0 "Complete Meet the Rebel Council, then open its profile. A rifle delivery still uses its ordinary cost and cooldown. Use a separate test save."
 MNT_state_debug_initialize:0 "DEBUG: Refresh the Four Panels"
 MNT_state_debug_initialize_desc:0 "Run the ordinary daily campaign manager. Preserves initialized values and existing trust. Available only in debug mode."
 MNT_state_debug_trip:0 "DEBUG: Preview the 1860 Trip"
 MNT_state_debug_trip_desc:0 "Open the real trip event ahead of time. Its choices can save or kill Danilo and close the succession chain. Use a separate test save."
 MNT_state_end_rations:0 "Restore Full Rations"
 MNT_state_end_rations_desc:0 "End the ration policy. Monthly food use rises by 2 and the monthly unrest penalty ends."
 MNT_state_escort_tt:0 "§GDanilo survives.§! Pay the escort price shown above. The ruler and succession stay unchanged."
 MNT_state_european_desk:0 "A Place in Europe"
 MNT_state_european_desk_desc:0 "France, Russia and Austria can help us, but each has its own aims. Foreign Policy Points let us choose which diplomatic work to pursue. The first two points are available from 1857."
 MNT_state_feud_accord_tt:0 "Pay §Y£currency_texticons|2 15,000§!. Unrest §G-10§!, modernity §G+5§!, domestic clan loyalty §G+1§!. Safe escort cost falls by §G£currency_texticons|2 5,000§!."
 MNT_state_feud_force_tt:0 "Central army §G+10§!; unrest §R+10§!. No feud settlement or escort discount."
 MNT_state_food_accounts:0 "Count Our Food"
 MNT_state_food_accounts_desc:0 "A small harvest can leave entire villages hungry. Start a public food account. Food stocks are national stores, separate from supplies sent to the rebels."
 MNT_state_food_accounts_result_tt:0 "£supply_texticon£ Food: §G+12§!"
 MNT_state_food_available_tt:0 "Have space for 24 food, enough money, no delivery cooldown, and peace with Austria."
 MNT_state_food_flow:0 "Monthly output: §G[?MNT.MNT_state_food_output|0]§!    Monthly use: §Y[?MNT.MNT_state_food_use|0]§!\nMonthly change: [?MNT.MNT_state_food_change|0+]"
 MNT_state_food_policy:0 "[GetMNTStateRations]\nFood use begins in January 1858. Below 10 food: clan unrest rises."
 MNT_state_food_price:0 "Kotor price: §Y£currency_texticons|2 [?MNT.MNT_state_grain_price_k|0]K§! for §G24 food§!   |   Treasury: £currency_texticons|2 [?MNT.MNT_state_treasury_k|1]K"
 MNT_state_food_reserve:0 "A Full Winter Store"
 MNT_state_food_reserve_desc:0 "Put a large food reserve under public protection. Gain 3% stability. The stock remains available for use."
 MNT_state_food_rules_tt:0 "§YFood account§!\nStocks: 0–100. Output starts at 4; use starts at 6 each month.\nAt war: +4 use. Mobilized clans: +2 use. Cut rations: -2 use, +2 unrest.\nStores and seed grain each add 2 output.\nBelow 10 food: +6 unrest/month; a raid ban adds another +4. Domestic clans lose one loyalty level when a shortage warning appears (at most once per 90 days).\nAbove 24 food: -2 unrest/month.\nRebel supply days and food in Montenegro are separate resources."
 MNT_state_food_stock:0 "£supply_texticon£ Food stored: §Y[?MNT.MNT_state_food|0]/100§!"
 MNT_state_food_title:0 "§YFOOD SUPPLY§!"
 MNT_state_foreign_help:0 "Each paid focus uses §Y1 point on completion§!.\nAid requests can be accepted or refused by the foreign court."
 MNT_state_foreign_title:0 "§YFOREIGN POLICY§!"
 MNT_state_foreign_tt:0 "These are the same support levels used in the Herzegovina crisis, capped at 3.\nAid requests go to the relevant country’s player or AI. Support is influence and diplomatic help; it does not automatically bring a power into war."
 MNT_state_france_value:0 "§Y[FRA.GetFlag] France§!: [?MNT.MNT_crisis_france|0]/3 support"
 MNT_state_french_case:0 "Make the French Case"
 MNT_state_french_case_desc:0 "Foreign Policy Points: §R-1§!.\n[GetMNTSupportFranceGain]\nReputation: §G+10§!.\nRebel trust: §R-5§!.\n[GetMNTRaidBanCost]"
 MNT_state_french_case_result_tt:0 "Foreign Policy Points: §R-1§!.\n[GetMNTSupportFranceGain]\nReputation: §G+10§!.\nRebel trust: §R-5§!.\n[GetMNTRaidBanCost]"
 MNT_state_future_locked:0 "§LReserved for a later focus§!"
 MNT_state_future_name:0 "§YAnother Seat§!"
 MNT_state_future_open:0 "§GSeat available§!"
 MNT_state_future_status:0 "[GetMNTStateFuture]"
 MNT_state_grain_purchase:0 "Buy Food in Kotor"
 MNT_state_grain_purchase_desc:0 "Pay £currency_texticons|2 [?MNT.MNT_state_grain_price_k|0]K for §G24 food§!. Purchases share a 30-day cooldown with the focus-tree button. Austria must be at peace with us. No food is bought on credit."
 MNT_state_grain_stores:0 "Build Village Stores"
 MNT_state_grain_stores_desc:0 "Keep grain close to the villages. Better storage raises monthly food output by 2."
 MNT_state_grain_stores_result_tt:0 "£supply_texticon£ Monthly food output: §G+2§!\nModernity: §Y+5§!"
 MNT_state_guard_dead:0 "§RNikola has succeeded Danilo.§! The 1860 succession crisis is closed."
 MNT_state_guard_locked:0 "§RPersonal guard not ready§!\nComplete Guard the Prince to open a protected visit in August 1860."
 MNT_state_guard_ready:0 "§GPersonal guard ready§!\nSafe escort: §Y£currency_texticons|2 [?MNT.MNT_state_guard_price_k|0]K§!. The fee is paid at the trip event."
 MNT_state_guard_survived:0 "§GDanilo survived.§! The 1860 succession crisis is closed."
 MNT_state_guard_unlock_tt:0 "§YGuard the Prince§! opens a safe paid escort in the August 1860 trip event.\nPrice: £currency_texticons|2 10,000; at 60 unrest or more: £currency_texticons|2 25,000. A feud settlement reduces either price by £currency_texticons|2 5,000.\nPostponing the visit always saves Danilo, at a cost of 40 political power and 10 reputation.\nOrdinary visit: 40% chance of death below 60 unrest; 80% at 60 unrest or above."
 MNT_state_guard_value:0 "[GetMNTStateGuard]"
 MNT_state_herzegovina_title:0 "§YHERZEGOVINA COUNCIL§!"
 MNT_state_italian_question:0 "The Italian War"
 MNT_state_italian_question_desc:0 "France and Austria are rivals in Italy. Decide whether to back Paris, keep the Kotor route quiet, or stay neutral. This is a diplomatic stance; it does not start a war.\n\n§YCosts 1 Foreign Policy Point when completed.§! Points are shared by all three foreign routes."
 MNT_state_italian_question_result_tt:0 "£MNT_crisis_diplomacy_texticon£ Foreign Policy Points: §R-1§!"
 MNT_state_italy_austria_tt:0 "[GetMNTSupportAustriaGain]\n[GetMNTSupportFranceLoss]\n[GetMNTRaidBanCost]"
 MNT_state_italy_france_tt:0 "[GetMNTSupportFranceGain]\n[GetMNTSupportAustriaLoss]\nModernity: §G+5§!."
 MNT_state_italy_neutral_tt:0 "Reputation §G+5§!. Support levels stay as they are."
 MNT_state_kotor_contract_tt:0 "Kotor food price falls to §G£currency_texticons|2 10,000§! for 24 food after this focus is completed."
 MNT_state_kotor_contracts:0 "Sign Kotor Contracts"
 MNT_state_kotor_contracts_desc:0 "Reliable merchants charge less. Food purchases fall from £currency_texticons|2 15,000 to £currency_texticons|2 10,000 for 24 food. Austria must remain at peace with us."
 MNT_state_ljubibratic:0 "A Desk for Ljubibratić"
 MNT_state_ljubibratic_desc:0 "Mićo Ljubibratić, Vukalović’s young secretary, can turn requests into clear reports. Rebel trust +5 and +1 Foreign Policy Point, once."
 MNT_state_ljubibratic_name:0 "§YMićo Ljubibratić§!"
 MNT_state_ljubibratic_result_tt:0 "Rebel trust: §G+5§!\n£MNT_crisis_diplomacy_texticon£ Foreign Policy Points: §G+1§!"
 MNT_state_ljubibratic_status:0 "[GetMNTStateLjubibratic]"
 MNT_state_local_command:0 "Respect Local Command"
 MNT_state_local_command_desc:0 "Let the rebel council make local decisions. Trust +12; central army -10. This keeps a partner beyond the frontier rather than a force under direct orders."
 MNT_state_local_command_result_tt:0 "Rebel trust: §G+12§!\nCentral army: §Y-10§!"
 MNT_state_management:0 "Montenegro: Food and Clan Policy"
 MNT_state_management_desc:0 "Food stores and public policy shape relations between the prince and the clans. The four campaign panels are in the national focus tree."
 MNT_state_mandate_rules_tt:0 "§YForeign Policy Points§!\nStart with 2 in 1857. Gain 1 on 1 January and 1 July in 1858, 1859 and 1860. Unused points remain available (maximum 8).\nA completed foreign policy focus costs 1 point. Only one national focus can run at a time, and no decision spends these points.\nA Desk for Ljubibratić gives 1 extra point once.\nThere are 8 paid diplomatic focuses. A foreign court may still refuse a request."
 MNT_state_modernity_value:0 "Modernity: §Y[?MNT.MNT_state_modernity|0]/100§!   |   0 = old customs, 100 = public institutions"
 MNT_state_next_1858_jan:0 "Next scheduled point: §Y1 January 1858§!"
 MNT_state_next_1858_jul:0 "Next scheduled point: §Y1 July 1858§!"
 MNT_state_next_1859_jan:0 "Next scheduled point: §Y1 January 1859§!"
 MNT_state_next_1859_jul:0 "Next scheduled point: §Y1 July 1859§!"
 MNT_state_next_1860_jan:0 "Next scheduled point: §Y1 January 1860§!"
 MNT_state_next_1860_jul:0 "Next scheduled point: §Y1 July 1860§!"
 MNT_state_next_point:0 "[GetMNTStateNextPoint]"
 MNT_state_nikanor_consecration:0 "Consecrate Nikanor Ivanović"
 MNT_state_nikanor_consecration_desc:0 "The church needs a metropolitan. Spend one Foreign Policy Point to choose consecration in Russia or in Austrian Karlovci. The chosen patron gains support and opinion; the rival loses both. Nikanor becomes an active metropolitan advisor and Missing Metropolitan ends. The choice is available before early peace talks; historically, he was consecrated in Russia in December 1858."
 MNT_state_no_more_points:0 "All scheduled points for 1857–60 have been awarded."
 MNT_state_our_own_voice:0 "Our Own Voice"
 MNT_state_our_own_voice_desc:0 "Use the support we have earned without accepting a single patron. Requires support from at least two powers. Gain 10 reputation and 5 modernity.\n\n§YCosts 1 Foreign Policy Point when completed.§! Points are shared by all three foreign routes."
 MNT_state_our_own_voice_result_tt:0 "£MNT_crisis_diplomacy_texticon£ Foreign Policy Points: §R-1§!\nReputation: §G+10§!\nModernity: §Y+5§!"
 MNT_state_paid_patrols:0 "Pay the Border Patrols"
 MNT_state_paid_patrols_desc:0 "Ban raids and offer paid work instead. Patrol pay costs £currency_texticons|2 5,000 each month. When paid, it removes 3 unrest; missed pay adds 4. Raids themselves remain outside this chapter."
 MNT_state_paid_patrols_result_tt:0 "§YRaid ban§!: if new, clan unrest §R+10§! and domestic clan loyalty §R-1 level§!."
 MNT_state_paris:0 "Write to Paris"
 MNT_state_paris_desc:0 "Ask France for funds.\nForeign Policy Points: §R-1§!.\nOn acceptance: 20,000 pounds; £MNT_support_france_up£ support §G+1§! (max. 3)."
 MNT_state_paris_result_tt:0 "Foreign Policy Points: §R-1§!.\nRequest sent. On acceptance: 20,000 pounds; £MNT_support_france_up£ support §G+1§! (max. 3)."
 MNT_state_patrols:0 "Paid Border Patrols"
 MNT_state_patrols_desc:0 "A small state service supports the army: organization +2%. Patrols cost £currency_texticons|2 5,000 a month. Paid patrols lower unrest by 3; missed pay raises it by 4. Unpaid patrols keep the organization bonus while awaiting pay."
 MNT_state_petersburg:0 "Reopen Russian Ties"
 MNT_state_petersburg_desc:0 "Ask Russia for rifles.\nForeign Policy Points: §R-1§!.\nOn acceptance: 100 rifles; £MNT_support_russia_up£ support §G+1§! (max. 3)."
 MNT_state_petersburg_result_tt:0 "Foreign Policy Points: §R-1§!.\nRequest sent. On acceptance: 100 rifles; £MNT_support_russia_up£ support §G+1§! (max. 3)."
 MNT_state_points_value:0 "£MNT_crisis_diplomacy_texticon£ Foreign Policy Points: §Y[?MNT.MNT_state_mandate|0]§!"
 MNT_state_postpone_tt:0 "§GDanilo survives.§! Political power §R-40§!; reputation §R-10§!."
 MNT_state_princely_guard:0 "Guard the Prince"
 MNT_state_princely_guard_desc:0 "Train a small personal guard. Opens a safe escort option for Danilo in August 1860. The trip still needs money, shown in this branch’s panel."
 MNT_state_princely_orders:0 "Orders from Cetinje"
 MNT_state_princely_orders_desc:0 "Seek a more direct chain of command. Central army +15, modernity +5, rebel trust -15. This is influence over the council; it does not annex Herzegovina."
 MNT_state_princely_orders_result_tt:0 "Central army: §Y+15§!\nModernity: §Y+5§!\nRebel trust: §R-15§!"
 MNT_state_public_offices:0 "Public Offices"
 MNT_state_public_offices_desc:0 "At least 60 modernity: daily political power +0.10. The bonus ends below 60 modernity."
 MNT_state_rations_off:0 "Full rations. Change this policy in Decisions."
 MNT_state_rations_on:0 "§YRations cut§!: monthly food use -2; monthly unrest +2."
 MNT_state_rebel_council:0 "Meet the Rebel Council"
 MNT_state_rebel_council_desc:0 "Luka Vukalović needs a partner he can trust. Meet his circle and open regular rifle deliveries. The trust shown here is the same value used in the Herzegovina crisis."
 MNT_state_rebel_council_result_tt:0 "Rebel trust: §G+5§!"
 MNT_state_rebel_food_tt:0 "Food §R-12§!; rebel trust §G+15§!."
 MNT_state_rebel_nofood_tt:0 "Rebel trust §R-12§!; clan unrest §G-4§!."
 MNT_state_rebel_promises:0 "What Have We Promised?"
 MNT_state_rebel_promises_desc:0 "A settlement for Montenegro may leave the Herzegovinians behind. Decide how much food and political support we can still offer."
 MNT_state_restore_ban:0 "Restore the Raid Ban"
 MNT_state_restore_ban_desc:0 "Unrest +10 and domestic clan loyalty -1 if the ban is new. This restores the ban, but does not erase a broken promise."
 MNT_state_resume_patrols:0 "Restore the Paid Patrols"
 MNT_state_resume_patrols_desc:0 "Restore the 2% organization bonus and monthly £currency_texticons|2 5,000 patrol pay. A first payment is not taken now. Paid months reduce unrest by 3; missed pay adds 4."
 MNT_state_revoke_ban:0 "Lift the Raid Ban"
 MNT_state_revoke_ban_desc:0 "Lift the raid ban.\nClan unrest: §G-8§!.\nClan loyalty: §G+1 level§!.\nReputation: §R-15§!.\n[GetMNTSupportFranceLoss]\n[GetMNTSupportAustriaLoss]"
 MNT_state_rifle_delivery:0 "Rifles for Vukalović"
 MNT_state_rifle_delivery_desc:0 "Send §Y25 rifles§!: rebel trust §G+8§!. During the covert phase only: rebel supplies §G+14 days§!, tension §R+3§!. A delivery is allowed every 45 days, until 1861."
 MNT_state_risk_tt:0 "[GetMNTStateTripRisk]\n§RIf Danilo dies: Nikola I becomes prince; stability -5%.§! These odds are a game rule, not a claim about the historical murder."
 MNT_state_russia_value:0 "§Y[RUS.GetFlag] Russia§!: [?MNT.MNT_crisis_russia|0]/3 support"
 MNT_state_russian_caution:0 "Accept Russian Caution"
 MNT_state_russian_caution_desc:0 "Foreign Policy Points: §R-1§!.\n[GetMNTSupportRussiaGain]\nRebel trust: §R-8§!.\nWar tension: §G-8§!."
 MNT_state_russian_caution_result_tt:0 "Foreign Policy Points: §R-1§!.\n[GetMNTSupportRussiaGain]\nRebel trust: §R-8§!.\nWar tension: §G-8§!."
 MNT_state_seed_grain:0 "Protect the Seed Grain"
 MNT_state_seed_grain_desc:0 "Keep enough seed for the next harvest. Raise monthly food output by 2 and modernity by 10."
 MNT_state_seed_grain_result_tt:0 "£supply_texticon£ Monthly food output: §G+2§!\nModernity: §Y+10§!"
 MNT_state_settle_feuds:0 "Settle Old Feuds"
 MNT_state_settle_feuds_desc:0 "Offer a legal settlement to hostile families. Both a state army and a clan compact need peace at home. Modernity +5; unrest -10. A settled feud also lowers the cost of protecting Danilo by £currency_texticons|2 5,000."
 MNT_state_start_rations:0 "Cut Food Rations"
 MNT_state_start_rations_desc:0 "Monthly food use §G-2§!, monthly clan unrest §R+2§!. Rations last until you end them."
 MNT_state_state_service:0 "Pay for State Service"
 MNT_state_state_service_desc:0 "Move service from personal duty to a state contract. Central army +25, modernity +10, clan unrest +10. Opens paid patrols."
 MNT_state_state_service_result_tt:0 "Central army: §Y+25§!\nModernity: §Y+10§!\n£stability_texticon£ Clan unrest: §R+10§!"
 MNT_state_suspend_patrols:0 "Stand Down the Paid Patrols"
 MNT_state_suspend_patrols_desc:0 "Stop the monthly £currency_texticons|2 5,000 payment and remove the 2% organization bonus. Clan unrest +5. The raid ban stays in force."
 MNT_state_trip_high:0 "§RUnprotected visit: 80% chance Danilo dies; 20% chance he survives.§!"
 MNT_state_trip_low:0 "§OUnprotected visit: 40% chance Danilo dies; 60% chance he survives.§!"
 MNT_state_trust_value:0 "£MNT_crisis_credibility_texticon£ Rebel trust in Montenegro: §Y[?MNT.MNT_crisis_vukalovic_trust|0]/100§!"
 MNT_state_unrest_tt:0 "§YPromises have a price§!\nA new raid ban: +10 unrest and -1 domestic clan loyalty.\nRestricting the captains’ plunder: +6 unrest and -1 loyalty, once.\nUnrestricted plunder: -6 unrest and +1 loyalty, once.\nHunger and missed patrol pay raise unrest. Relief and compensation reduce it.\nAt 60 unrest, Danilo’s escort costs more and an unprotected visit is more dangerous.\nA signed border pledge is remembered even if you later lift the ban."
 MNT_state_unrest_value:0 "£stability_texticon£ Clan unrest: §Y[?MNT.MNT_state_unrest|0]/100§!"
 MNT_state_vienna:0 "Talk to Vienna"
 MNT_state_vienna_desc:0 "Ask Vienna to secure the Kotor food route.\nForeign Policy Points: §R-1§!.\nOn acceptance: 20 food; £MNT_support_austria_up£ support §G+1§! (max. 3)."
 MNT_state_vienna_result_tt:0 "Foreign Policy Points: §R-1§!.\nRequest sent. On acceptance: 20 food; £MNT_support_austria_up£ support §G+1§! (max. 3)."
 MNT_state_village_relief:0 "Bread for the Villages"
 MNT_state_village_relief_desc:0 "Distribute 12 food to the villages. Clan unrest falls by 12 and each domestic clan gains one loyalty level."
 MNT_state_village_relief_result_tt:0 "£supply_texticon£ Food: §R-12§!\n£stability_texticon£ Clan unrest: §G-12§!\nDomestic clan loyalty: §G+1 level§!"
 MNT_state_vuka_name:0 "§YLuka Vukalović§!"
 MNT_state_zimonjic:0 "Couriers to Zimonjić"
 MNT_state_zimonjic_desc:0 "Bogdan Zimonjić connects local leaders in Herzegovina. Give his couriers a clear route to Cetinje: rebel trust +8, clan unrest -3."
 MNT_state_zimonjic_name:0 "§YBogdan Zimonjić§!"
 MNT_state_zimonjic_result_tt:0 "Rebel trust: §G+8§!\n£stability_texticon£ Clan unrest: §G-3§!"
 MNT_state_zimonjic_status:0 "[GetMNTStateZimonjic]"

 # NATIONAL FOCUSES AND LATER BRANCHES
 MNT_focus_bring_weapons_to_montenegro:0 "Prepare the Supply Routes"
 MNT_focus_bring_weapons_to_montenegro_desc:0 "Secure foreign rifles and experienced guides for the border crossings. Gain 50 rifles and 21 days of rebel supplies; future discreet ammunition operations become more effective."
 MNT_focus_defend_the_nation_n:0 "Open War on the Frontier"
 MNT_focus_defend_the_nation_n_desc:0 "Recorded automatically if negotiations are abandoned and war with the Ottoman Empire begins. Raise the domestic clan levies in the Clan Assembly and follow the battlefield missions. This focus does not declare a second war or award a settlement by itself."
 MNT_focus_failure_of_the_revolt:0 "We Were Defeated"
 MNT_focus_failure_of_the_revolt_desc:0 "the spark of the Herzegovinian uprising has been extinguished, our goals can no longer be achieved by supporting the Herzegovinian uprising, but our struggle must continue, and we will therefore only take on this conflict with our own forces"
 MNT_focus_guerrilla_war:0 "Support the Herzegovinian Uprising"
 MNT_focus_guerrilla_war_desc:0 "Support the rebels in Herzegovina. Send supplies, work with the clans and seek foreign support. Open Decisions to manage the uprising. Keep your help quiet: armed raids raise the risk of war. Your choices can lead to a peace deal or open war."
 MNT_focus_into_the_new_age:0 "Into the New Age"
 MNT_focus_into_the_new_age_desc:0 "Montenegro is a poor and undeveloped region. We are still behind many of our rivals. We need to modernize as quickly as possible if we want to get back to our place under the sun. "
 MNT_focus_Montenegrin_question:0 "Build the Diplomatic Case"
 MNT_focus_Montenegrin_question_desc:0 "Present the frontier dispute to the European courts. Gain 10 diplomatic credibility and use the memorandum and appeals in Decisions. France, Russia and Austria can each mediate; support for this uprising does not force us to choose a single patron."
 MNT_focus_negotiate_a_ceasefire:0 "Negotiated Ceasefire"
 MNT_focus_negotiations_with_the_ottomans_n:0 "Negotiate the Herzegovinian Crisis"
 MNT_focus_negotiations_with_the_ottomans_n_desc:0 "Peace talks have begun. In Decisions, choose the territory and rights you want, then add promises to lower Ottoman demands. Send up to three proposals before time runs out."
 MNT_focus_new_goals_for_our_nation:0 "New Goals for our Nation"
 MNT_focus_new_goals_for_our_nation_desc:0 "Continue once the uprising or frontier war has been resolved. The agreed or imposed settlement is already in force; this focus opens the next political chapter and the later competition for influence between France and Russia."
 MNT_focus_normalization_of_the_relations_with_russia:0 "Normalization of the Relations with Russia"
 MNT_focus_normalization_of_the_relations_with_russia_desc:0 " "
 MNT_focus_outbreak_of_the_pro_Montenegro_revolt:0 "Intensify the Uprising"
 MNT_focus_outbreak_of_the_pro_Montenegro_revolt_desc:0 "A stronger insurgency permits wider action. Requires at least 55 insurgent strength during indirect war; adds 12 strength and 15 escalation. This is a deliberate increase in pressure, while war remains a separate choice."
 MNT_focus_prepare_the_clans_for_conflict:0 "Prepare the Clan Levies"
 MNT_focus_prepare_the_clans_for_conflict_desc:0 "Prepare the clan levy templates and acquire 50 rifles. During indirect war, also add 8 insurgent strength. This preparation remains available during a war. The Clan Assembly shows each clan's loyalty and military contribution. Neutral or loyal domestic clans can be raised individually or together once war begins; foreign clans require a territorial settlement first."
 MNT_focus_recognize_our_status_under_the_ottomans:0 "Recognise Our Status to Ottomans"
 MNT_focus_recognize_our_status_under_the_ottomans_desc:0 " "
 MNT_focus_recognize_our_status_under_the_ottomans_n:0 "The Frontier Settlement"
 MNT_focus_recognize_our_status_under_the_ottomans_n_desc:0 "The Ottoman Empire has accepted a peace deal. Open Decisions to review what Montenegro gained and what it promised. The border commission will report 90 days after signing."
 MNT_focus_strike_a_deal_with_the_ottomans_n:0 "Settlement after the Fighting"
 MNT_focus_strike_a_deal_with_the_ottomans_n_desc:0 "Recorded by the existing battlefield missions after a favourable result. The postwar event chain applies the territorial settlement. This outcome is separate from the peaceful package negotiated during the uprising."
 MNT_focus_support_the_clans_beyond_our_territory:0 "Meet the Border Captains"
 MNT_focus_support_the_clans_beyond_our_territory_desc:0 "Meet the border captains and choose disciplined assistance or unrestricted raids in the resulting event. If the captains have already been consulted through Decisions, gain 5 insurgent strength instead. This supports the Herzegovinian uprising; it does not annex the outer clans."
 MNT_focus_the_mostar_convention_n:0 "The Mostar Convention"
 MNT_focus_the_mostar_convention_n_desc:0 "Recorded by the existing battlefield missions after an adverse military result. The Mostar Convention applies its restrictions and the postwar event chain. It is an outcome of fighting, rather than a concession bought in the peaceful negotiating draft."
 MNT_focus_the_reign_of_danilo:0 "The Reign of Danilo"
 MNT_focus_the_reign_of_danilo_desc:0 " "
 MNT_focus_the_reign_of_nikola:0 "The Reign of Nikola"
 MNT_focus_the_reign_of_nikola_desc:0 " "
 MNT_the_ottomans_obsolutely_lost:0 "We Defeated Ottomans"
 MNT_the_ottomans_obsolutely_lost_desc:0 "After a long fight we managed to finally defeat our oppressors! But the fight is still not over, now we have to negotiate with the ottomans and proove our strenght at the negotiation table"

 # CHARACTERS AND TRAITS
 MNT_advisor_Jan_Vaclik:0 "Jan Vaclík"
 MNT_chancellor_vaclik:0 "Chancellor"
 MNT_chancellor_vaclik_desc:0 "Jan Vaclík handles the prince’s foreign correspondence and daily diplomatic work."
 MNT_trait_darinka_petrovic_njegos:0 "Princess Consort of Montenegro"
 MNT_trait_knyaz:0 "Knjaz"
 MNT_trait_metropolitan_of_montenegro:0 "Metropolitan of Montenegro and the Highlands"
 POLITICS_Danilo_I__DESC:0 "Danilo I, ruler of Montenegro, is the first secular ruler for a very long time. He rules with a tough and wise hand. Through his power and reforms, he is leading Montenegro to one ultimate goal, independence. Another intension, he made for himself is to make his nation modern and powerful. Montenegro's goals under his leadership are to become a regional power and liberate all rightful lands from any oppressor."
 POLITICS_NIKOLA_I_PETROVIC_DESC:0 "Nikola I. Petrović-Njegoš born on 25 September 1841, is the son of famous Montenegrin commander Mirko Petrović-Njegoš. After his father renounce the throne, he became the next pretender in line. His goals are to continue Danilo's legacy. This means reforms and armed power liberate Montenegrin lands from oppressors and reform the whole nation to bring it into the modern age of tomorrow."

 # OTHER MONTENEGRIN EVENTS
 montenegro.2.a:0 "Horrible news."
 montenegro.2.d:0 "Our knjaz Danilo was going on a planned diplomatic trip to France where he want to meet their ruler. Everything was going as planned when the delegation arrived at the port of Kotor. There they planned after some rest embark on a ship to France. But today, when everything was loaded on the ship unknown stranger appeared from the crowd. He appeared from a crowd near Danilo and a few times shot on him. Unfortunately, he hit the target. Assassin, when trying to disappear in the crowd, was later identified as Todor Kadić. Danilo was transported to his room, where he is now dying surrounded by his close ones."
 montenegro.2.t:0 "Knjaz Danilo Assassinated"
 montenegro.3.a:0 "Knjaz is dead. Long live the knjaz Nikola I."
 montenegro.3.d:0 "The echo of fire in Kotor on our leader knjaz Danilo is still heard throughout Montenegro. After two days of fighting for his life, surrounded by his wife and close friends, he passed away. This left us with a much greater question, and that is his succession. He had only one daughter, princes Olga who is one year old. The closest male relative is his brother and army commander, Mirko Petrović-Njegoš. But he has rejected the throne for himself and offers to make Nikola the next knjaz. Coronation will be held shortly after Danilo, would be buried in Cetinje."
 montenegro.3.t:0 "Aftermath of Assassination"
 montenegro.5.a:0 "We must win."
 montenegro.5.d:0 "The Ottomans found out about us supporting the rebels in Herzegovina. The Porte has decided to attack our country because of that. We must defend our country!"
 montenegro.5.t:0 "Ottoman Empire Declared War!"
 montenegro.9.a:0 "Great project, but I would rather be back in Cetinje."
 montenegro.9.d:0 "We manage to build the main phase of our greatest project. That's the building of a completely new town on green fields. Danilovgrad is planned as a modern city with wide narrow streets, parks, a sewer system, and many other citizens services. A city full of modernly-looking buildings, beautiful parks, and wide streets with plenty of shops is truly a collection of what can modern architecture offer. There are even some rumors that the town, named after Danilo I., should be the new capital city of Montenegro."
 montenegro.9.t:0 "Building of Danilovgrad"
 montenegro.10.a:0 "We have to accept this great deal."
 montenegro.10.b:0 "We shouldn't accept. It's too risky."
 montenegro.10.d:0 "Today Montenegrin delegation came to us with the offer of signing an agreement about trade in Kotor bay and surrounding areas to the Montenegrin border. There are reasons for this, as it would economically stimulate the region, support local businesses, and many more. But there are a few reasons against it, as that could spark nationalism in the region, which Montenegro has claimed, or a little chance of a diplomatic clash with the Ottoman empire because they don't recognize Montenegrin independence."
 montenegro.10.t:0 "Trade Agreement with Montenegro in Kotor Bay?"
 montenegro.11.a:0 "Amazing. What a great day."
 montenegro.11.d:0 "Today, we receive an answer about a trade deal in Kotor bay. The Austrian side had accepted our offer. This will greatly benefit both sides. We are eager to expand this cooperation and happy to see every fruit of this cooperation in the future."
 montenegro.11.t:0 "Austria Accepts Proposal"
 montenegro.12.a:0 "That shouldn't happen. Bad day for us all."
 montenegro.12.d:0 "Today, we received an answer about a trade deal in Kotor bay. The Austrian side had refused our offer. They add to the official answer reasons why, as it would undermine their order in the region or that it's only cover by us to support Montenegrin terrorism in the area of Kotor and its surrounding."
 montenegro.12.t:0 "Austria Declines Proposal"
 montenegro.13.a:0 "Truly amazing."
 montenegro.13.d:0 " "
 montenegro.13.t:0 "First People's Census"
 montenegro.14.a:0 "Let our Eagle fly high above our enemy."
 montenegro.14.d:0 "One main goal of our army reform was to unite all tribe's armies into one capable force, which could drive Ottomans and other occupiers out of our rightful lands. This couldn't be achieved without unifying symbols, flags, and other recognition stuff of our army. By introducing Alaj-Barjak, we will have one flag for one army in our land."
 montenegro.14.t:0 "Alaj-Barjak"
 montenegro.15.a:0 "We need to do something about that to expel Ottomans back where they came from."
 montenegro.15.d:0 " "
 montenegro.15.t:0 "Situation of Montenegrin Army"
 montenegro.16.a:0 "Let our music play when we push invaders from our lands."
 montenegro.16.d:0 " "
 montenegro.16.t:0 "Montenegrin Army Band"
 montenegro.17.a:0 "Another huge step toward a modern state."
 montenegro.17.d:0 " "
 montenegro.17.t:0 "Danilo's Code - Montenegrin Law"
 montenegro.18.a:0 "Very interesting."
 montenegro.18.d:0 " "
 montenegro.18.t:0 "Montenegrin Foreign Situation"
 montenegro.19.a:0 "Let's hope we can gain their support."
 montenegro.19.d:0 " "
 montenegro.19.t:0 "Montenegrin State Visit to France"
 montenegro.20.a:0 "We can do that for them."
 montenegro.20.b:0 "We don't want to risk diplomatic confrontation."
 montenegro.20.d:0 " "
 montenegro.20.t:0 "Offer of Our Protection to Montenegro"
 montenegro.21.a:0 "Send diplomatic protest to them."
 montenegro.21.b:0 "Leave it be."
 montenegro.21.d:0 " "
 montenegro.21.t:0 "Montenegro Inform us About State Visit in France"
 montenegro.22.a:0 "They don't know, where are theirs limits."
 montenegro.22.d:0 " "
 montenegro.22.t:0 "Russia Send Diplomatic Protest to us"
 montenegro.23.a:0 "That's a little we can offer to them."
 montenegro.23.d:0 " "
 montenegro.23.t:0 "Montenegro Send Request of Economic Help"
 montenegro.24.a:0 "Thanks to Jan Vaclík."
 montenegro.24.d:0 "The publication of the book 'La Souveraineté Du Monténégro Et Le Droit Des Gens Moderne De L'Europe' describes Montenegro and its struggle for freedom and recognizes it as a legitimate, independent, and strong state."
 montenegro.24.t:0 "New Publication from Jan Vaclík Published"
 montenegro.25.a:0 "Thanks to Henri Delari."
 montenegro.25.d:0 "The publication of book, Crna Gora, povijest, opis, udi, obiaji, zakonodavstvo, politiko ustrojstvo, slubeni dokumenty (Le Monténégro, histoire, description, murs, usages, législation, constitution politique, documents officiels, 1862) as well as Putovanje u Crnu Goru (Voyage au Monténégro, 1862) The book describes the political affairs of our state, our rights, and generally introduces the reader to our culture and customs and interesting facts about Montenegro."
 montenegro.25.t:0 "New Publication from Henri Delari Published"
 montenegro.26.a:0 "They will pay for it."
 montenegro.26.d:0 " "
 montenegro.26.t:0 "Montenegro Support Uprising in Herzegovina"
 montenegro.27.a:0 "They don't know what they're writing about."
 montenegro.27.d:0 "Today, the Ost-Deutsche Post published an article focusing on the situation in Montenegro that criticizes the actions of Montenegro, refers to us as the perpetrators of unrest in the Balkans, and openly talks about the fact that Montenegro deserves to be taught a lesson."
 montenegro.27.t:0 "Article in Ost-Deutsche Post Newspaper"
 montenegro.33.a:0 "The enemy of our enemies is my friend. Isn't that right?"
 montenegro.33.d:0 "On our territory, there are lots of uncontrollable armed criminal bands. These so-called Jaroši are potential problems, but they are also experienced fighters. So we could offer to pardon them if they joined our struggle in Hercegovina or even if they succeeded in joining our army there."
 montenegro.33.t:0 "Jaroši Battalions"
 montenegro.37.a:0 "Truly interesting development."
 montenegro.37.d:0 "As mist and fog disappear from battlefields, it starts to be clear who was on top in this clash. After a short but bloody confrontation, the Ottomans are a clear winner. We can only predict what will happen next. We can only predict if it will be a new agreement dictated by the Ottoman Empire."
 montenegro.37.t:0 "Ottomans Wins"
 montenegro.38.a:0 "We would support Montenegro."
 montenegro.38.b:0 "We'd rather stay neutral to avoid escalation."
 montenegro.38.c:0 "We would support the Ottoman Empire."
 montenegro.38.d:0 "After the failure of the negotiations in Mostar, both sides had taken up arms. The Ottoman Empire had sent its troops to the borders of Montenegro. This was done to establish its rule in the region it considers as its territory. But this is a risky move because too large an army could provoke a wider uprising of other nations in the unstable Balkan. This could also escalate the situation between the great powers, which aren't keen on the possible breaking of regional stability and the European concert of nations."
 montenegro.38.t:0 "Montenegrin - Ottoman War"
 montenegro.39.a:0 "Let's hope we gain more than we lost."
 montenegro.39.d:0 "Our actions in the Montenegrin crisis may have brought us gains or losses. This would be counted and added to respective countries according to their moves."
 montenegro.39.t:0 "End of Montenegrin Crisis - Receiving Bonuses"
 montenegro.40.a:0 "Accept their demands."
 montenegro.40.b:0 "Propose compromise to them."
 montenegro.40.c:0 "Send in the army on these daredevils."
 montenegro.40.d:0 "Mostar negotiations are in full swing, and the Montenegrin delegation has presented a list of their demands they want to achieve. One of them is full     Montenegrin independence, territorial expansion to ethnically Montenegrin territory or lifting the arms import embargo. Now, it's time for our delegation to say our stances on these requests."
 montenegro.40.t:0 "Mostar Negotiations"
 montenegro.41.a:0 "We have to accept this deal."
 montenegro.41.b:0 "We can't accept it. We have to stick to our goals."
 montenegro.41.d:0 "Ottomans send us a compromise proposal. In it, they are saying that they can't accept our full independence but are willing to compromise on certain points such as arms export or greater autonomy. As we are discussing this proposal, we are also acknowledging the variant that if we refuse the offer, it will offend Sultan. That would mean a military expedition against us."
 montenegro.41.t:0 "Ottomans Offers Compromise"
 montenegro.42.a:0 "Brothers, to arms."
 montenegro.42.d:0 "Ottomans were offended by our request for self-determination and independence. They have taken it so seriously that they send an army regiment after us. We need to prepare our defensive position and wait for their retaliation."
 montenegro.42.t:0 "Ottomans Sends Army After Us"
 montenegro.43.a:0 "Mobilize our army."
 montenegro.43.d:0 "Today, we got the answer from the Montenegrin delegation.  We got a negative answer from them, which means only one thing. That is the military expedition to crush these rebels and force our ultimatum upon them."
 montenegro.43.t:0 "Montenegrins Refused Our Demands"
 montenegro.44.a:0 "Truly interesting development."
 montenegro.44.d:0 "As mist and fog disappear from battlefields, it starts to be clear who was on top in this clash. After a short but bloody confrontation, Montenegro is a clear winner. We can only predict what will happen next. We can only predict if it will be a new agreement dictated by Montenegro."
 montenegro.44.t:0 "Montenegro Wins"
 montenegro.45.a:0 "Rule Herzegovina with an iron fist to suppress any uprising before it can begin."
 montenegro.45.b:0 "Let's keep our promises to rebel leaders."
 montenegro.45.d:0 "Today, the surrender of the last rebels in Herzegovina was announced, and now we will decide what will happen to them. But let's keep in mind that we have promised Luka Vukalovic, who is their leader, the title "Vojvode of Zubac, Kruevica, Draevica and Sutorina" and amnesty for all rebels who peacefully surrendered to us. It is up to us if we keep our promises, thanks to which Herzegovina's uprising was quelled."
 montenegro.45.t:0 "Fate of Herzegovina Rebellion"
 montenegro.46.a:0 "Will this be the final battle that ends this confrontation?"
 montenegro.46.d:0 "Following the defeats on battlefields and the potential overall collapse of their army, the Montenegrin government decided today to surrender and admit defeat. We need to scatch demands, which would be definitely agreed upon in the Albanian city of Scrutari."
 montenegro.46.t:0 "Fate of Montenegro"
 montenegro.48.a:0 "It looks like it is the beginning of the end of our influence over Montenegro."
 montenegro.48.d:0 "Today, our army suffered a crippling defeat near the village of Grahovec. We lost our men, cannons, rifles, glory, and, most importantly, morale. Despite this loss, it is necessary to point out that the Montenegrin soldiers behaved honourably and allowed us to bury our deceased soldiers."
 montenegro.48.t:0 "Battle of Grahovec"
 montenegro.49.a:0 "What a terrible situation. We need to offer assistance to refugees."
 montenegro.49.d:0 "As a result of the war and the terror perpetrated by the Ottomans on our population, literally, hordes of refugees are fleeing from the borderlands that are under Ottoman rule to Montenegro proper, where they are looking for a better life. But unfortunately for us, we are not sufficiently supplied with food and other needed materials for them. Another severe fact is that there aren't enough jobs and land for them. We will have to take care of our fellow Montenegrins, although we are not prepared to accommodate them."
 montenegro.49.t:0 "War Damaged Lands"
 montenegro.50.a:0 "We are brothers in arms. Surely, we would support them."
 montenegro.50.b:0 "Play as Herzegovina. (Montenegro will support you.)"
 montenegro.50.c:0 "We don't want to risk another confrontation with the Ottomans."
 montenegro.50.d:0 "After a long period of unquelled unrest in Herzegovina, Luka Vukalovic gathered enough resources and stepped out of the shadows to escape Ottoman brutality. His main effort is to win the freedom of his people. Vukalovic has long worked with Montenegro, and we inspired him when we gained "de facto" independence in 1853. Our long and good relations suggest that we could gain a powerful ally in them. Or even a potential union between our two states."
 montenegro.50.t:0 "Uprising in Herzegovina"
 montenegro.51.a:0 "Their treachery will be rightfully rewarded."
 montenegro.51.d:0 "Today, we got the news from our Herzegovina battlegrounds. Montenegro began combat actions in support of the rebels in Herzegovina. These rebels are terrorizing the population and murdering our men. Their activity had only increased these days."
 montenegro.51.t:0 "Montenegro Supports Herzegovina Uprising"
 montenegro.52.a:0 "Our goal is to weaken the Ottoman Empire. We will support Montenegro."
 montenegro.52.b:0 "Let's watch the situation from a safe distance, it's too risky."
 montenegro.52.c:0 "We make commitment to Ottoman integrity. We will support the Ottoman Empire."
 montenegro.52.d:0 "Montenegro is the most famous supporter of the Herzegovinian rebellion. They gained such an influence in the area that what was originally peasant unrest now grew into a liberation struggle of the region from Ottoman rule. This situation brings to us many possible options for us how to expand our influence in the region. We can watch the situation more closely and use as much as possible to assert our interest. But there is a risk that if things don't go our way, we will have to consider diplomatic intervention."
 montenegro.52.t:0 "Montenegrin Revolt"
 montenegro.59.a:0 "Wish him a good luck on his travels."
 montenegro.59.d:0 "As a result of the Scutari Conventions, Mirko Petrović-Njegoš, brother of Danilo I and father of Nikola I, has to leave the territory of Montenegro, mainly because he is responsible for the victory at the Battle of Grahovec, making him the symbol of the Montenegrin national resistance."
 montenegro.59.t:0 "Deportation of Mirko Petrović-Njegoš"
 montenegro.60.a:0 "We lose Sanjak, but we keep Podgorica."
 montenegro.60.b:0 "We lose Podgorica, but we keep Sanjak."
 montenegro.60.d:0 "As a result of our victory, peace was negotiated between us and the Ottomans. However, we cannot efficiently cover all of the conquered territories, and the Ottomans know it. Therefore, they might attack us again and take back their lost provinces. Fortunately, after their catastrophic defeat, they changed their tone and are now willing to respect us. Therefore, it will be in our best interest to hand over to them some of the territories before we lose them by force."
 montenegro.60.t:0 "Territorial reorganization"
 montenegro.61.a:0 "We're a strong country that doesn't need any help from the enemy."
 montenegro.61.b:0 "Any help will come in handy. After all, it's their fault."
 montenegro.61.d:0 "As a result of the war, we have suffered enormous damage, which is why some people are calling for the Ottomans to pay war reparations to us. This can greatly help our post-war economic recovery. On the other hand, it would be surely very humiliating for our enemies and could damage their international pride and our long-term relations."
 montenegro.61.t:0 "Demanding War Reparations"
 montenegro.108.a:0 "Let's knock down the sick man on the Bosphorus."
 montenegro.108.d:0 "The Ottoman Empire refused to recognize the independence of Montenegro because they still considered it as part of their empire. Therefore, the peaceful coexistence of our two states is almost impossible, and the problem will have to be solved with weapons in hand."
 montenegro.108.t:0 "Failure of Negotiation"
 montenegro.109.a:0 "Let's knock down the sick man on the Bosphorus."
 montenegro.109.d:0 "The Ottoman Empire refused to recognize the independence of Montenegro because they still considered it as part of their empire. Therefore, the peaceful coexistence of our two states is almost impossible, and the problem will have to be solved with weapons in hand."
 montenegro.109.t:0 "Failure of Negotiation"
 montenegro.110.a:0 "Let's knock down the sick man on the Bosphorus."
 montenegro.110.b:0 "We also support compromise."
 montenegro.110.d:0 "The Ottoman Empire is interested in an agreement with Montenegro but still regards us as their autonomous territory rather than a sovereign state. It is up to us whether we accept the small concessions provided by the Ottoman Empire or resolve the matter face-to-face with them at gunpoint."
 montenegro.110.t:0 "Ottomans Offers Compromise"
 montenegro.117.a:0 "The enemy of our enemies is my friend. Isn't that right?"
 montenegro.117.d:0 "On our territory, there are lots of uncontrollable armed criminal bands. These so-called Jaroši are potential problems, but they are also experienced fighters. So we could offer to pardon them if they joined our struggle in Hercegovina or even if they succeeded in joining our army there."
 montenegro.117.t:0 "Jaroši batalions"
 montenegro.121.a:0 "Let´s celebrate this significant victory."
 montenegro.121.d:0 "We succeeded in capturing the capital of Montenegro and the centre of the struggle against the Ottoman Empire. With this great victory, we forced the Montenegrins to surrender, making it much easier for us to suppress the uprising in Herzegovina."
 montenegro.121.t:0 "Fall of Cetinje"
 montenegro.122.a:0 "Is this the end of Montenegro?"
 montenegro.122.d:0 "Our capital has just fallen today, and we have suffered one of the greatest defeats in our nation's history. We no longer have any base from which to wage war against Ottoman expansionism. We must fly the white flag and throw ourselves at the mercy of the Ottomans."
 montenegro.122.t:0 "Fall of Cetinje"
 montenegro.123.a:0 "One step closer to victory."
 montenegro.123.d:0 "Today, we received news that our army has conquered the territory of Outer Montenegro."
 montenegro.123.t:0 "Conquest of Outer Montenegro"
 montenegro.124.d:0 "Today, we received news that our army has conquered the territory of Western Sanjak."
 montenegro.124.t:0 "Conquest of Western Sanjak"
 montenegro.125.a:0 "One step closer to victory."
 montenegro.125.d:0 "Today, we received news that our army has conquered the territory of Podgorica."
 montenegro.125.t:0 "Conquest of Podgorica"
 montenegro.126.a:0 "We need more luck in future battles."
 montenegro.126.d:0 "We have now a report from a clash that occurred between our armies in earlier hours. It was firstly truly unbelievable, but after the raging battle calmed down winning side became clear. Our armies had been defeated and fled from the battlefield. This left our enemy with much valuable loot, which he could use as he wanted. It's truly a sad day for us all, and more specifically for close ones to them, who felt for nothing. Let's hope this will never repeat."
 montenegro.126.t:0 "We Were Defeated in the Battle"
 montenegro.127.a:0 "Oops."
 montenegro.127.d:0 "If you get this, something is probably wrong."
 montenegro.127.t:0 "Stalemate"
 montenegro.128.d:0 "We have now a report from a clash that occurred between our armies in earlier hours. It was firstly truly unbelievable, but after the raging battle calmed down winning side became clear. Our armies had managed to strike a glorious victory over the enemy, which had fled the battlefield and left much valuable loot which can we display during our parades."
 montenegro.128.t:0 "We Won the Battle"
 montenegro.165.a:0 "Let's find someone. Quickly."
 montenegro.165.d:0 "Yesterday, Henri Delarue left to return to France due to negotiations with the Ottomans had ended. With this, his diplomatic missions in Montenegro ends. This was the reason why he was sent to us. Other reasons were to help us manage administration and gather foreign support for our cause. Because he held the position of our chancellor, his place is now vacant. We must find someone who could replace him and continue in his job. This would be hard because it must be someone very educated with knowledge about Montenegro, some administrative skills, and many more."
 montenegro.165.t:0 "Departure of Henri Delarue for France"
 montenegro.166.a:0 "Let's leave it up to him to figure it out."
 montenegro.166.b:0 "Let's solve his problems with the Austrian authorities."
 montenegro.166.d:0 "Jan Vaclík answered our offer. He happily accepted it and was heading toward Montenegro. But when he arrived at the Austrian border, he got into problems with the Austrian border police. They refuse to let him across the border to serve our government. This left us with two options. The first is to leave him alone to figure it out and hope that he can make it. The second is to officially international support him, which is an efficient option but may prove costly."
 montenegro.166.t:0 "Jan Vaclík's Problems on the Border"
 montenegro.167.a:0 "We must help him."
 montenegro.167.d:0 "When we left Jan Vaclík on the Austrian border without a reply, he became a bit desperate because his every attempt to cross the border by almost every means failed. He few times tried to contact us, but we were always silent. We need to contact him back and promise him our diplomatic support, or we risk he will leave back home. Jan Vaclík is too valuable for us, and our cause to be lost only because of the Austrian border police."
 montenegro.167.t:0 "Jan Vaclík's Problems Continue"
 montenegro.168.a:0 "Well, let's make him Chancellor."
 montenegro.168.d:0 "Today we receive a message. Our candidate for the role of our chancellor had arrived in our capital Cetinje. He finally manage to get to us, even through his difficult journey. After he will rest, he has an audience with our ruler Danilo. It's expected that they would talk about Vaclík's potential new job, his life, and his work. Let's hope everything will go as planned because it's in the best interest of Montenegro and its national interests."
 montenegro.168.t:0 "Jan Vaclík Successfully Arrived in Montenegro"
 montenegro.169.a:0 "Send him our offer."
 montenegro.169.d:0 "With Henri Delarue's return to France, we have lost our chancellor, so it is appropriate to find a replacement to help us build our independent state and promote our interests abroad. We have found someone who would meet all of our requirements. His name is Jan Vaclík, and he's a Czech writer, lawyer, and diplomat with close relation to Balkan and more, specifically Montenegro. He is writing articles and books about Montenegro, its foreign political situation, and many more. By our suggestions, he is the best choice we have."
 montenegro.169.t:0 "Question of New Chancellor"
 montenegro.200.a:0 "What a bad day to all of us."
 montenegro.200.d:0 "We make great efforts to improve our agriculture and this country as a whole, but our striving had almost no effect. We ended with a lack of resources, resistance from some farmers, and bad planning for implementing reforms. But the world isn't ending here. We and our nation live on it. We should strive to improve our ways how to implement our reforms and learn from our mistakes for future."
 montenegro.200.t:0 "Agricultural Reform Failed"
 montenegro.201.a:0 "Great achievement for whole nation."
 montenegro.201.d:0 "We manage to get over all obstacles we have in our way to successfully finish our reform. This will surely lead to better living conditions, but also to improved productivity and stability of our country. Reform's success not only bolstered food security but also contributed to rural development and economic growth. This will greatly improve our current situation on our path toward independence."
 montenegro.201.t:0 "Agricultural Reform Succeeded"
 montenegro.226.a:0 "Great news."
 montenegro.226.d:0 " "
