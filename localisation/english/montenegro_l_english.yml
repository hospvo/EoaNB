 MNT_clans_loyalty_minus3:0 "§RRevolt · −3§!"
 MNT_clans_mountain_trait_tt:0 "§YMOUNTAIN IRREGULARS§!\nMountain attack: §G+10%§!\nMountain defence: §G+15%§!\n\nThese are the existing irregular infantry battalion’s terrain modifiers. They apply when its troops fight in mountains. This icon does not add a second bonus."
 MNT_clans_muster_locked:0 "§YPreparation required§!"
 MNT_clans_muster_peace:0 "§YAt peace§!"
 MNT_clans_muster_tt:0 "£MNT_crisis_strength_texticon£ §YCall every eligible clan§!\nEach ready clan raises one division, sized by its military strength. Clans already raised cannot be called again. Foreign clans, rebels and opponents do not join.\n\n§YLevies remain until all wars and the frontier conflict have ended.§! The mobilization bonus no longer expires every 200 days.\n\n$MNT_clan_badge_tt$"
 MNT_clans_muster_war:0 "§RMobilization open§!"
 MNT_clans_petition_tt:0 "£political_power_texticon£ §YNegotiate with the clan elders§!\nPolitical power: §R−15§!\nClan loyalty: §G+1§! (maximum +3).\n\n§Y45-day cooldown for this clan.§! Cannot bargain with raised levies, clans in open revolt or clans beyond our territory."
 MNT_clans_political_influence:0 "Clan Political Influence"
 MNT_clans_political_influence_desc:0 "The political voice of all nine clans. Their combined influence changes political power gain by [MNTclansInfluenceTotalValue]. The total is recalculated daily and after clan actions; it does not stack on refresh."
 MNT_clans_promote_tt:0 "£MNT_crisis_diplomacy_texticon£ §YPromote the domestic clan elders§!\nAfter §Y100 days§!, every domestic clan not in open revolt gains §G+1 loyalty§! (maximum +3). Clans beyond our territory are unaffected."
 MNT_clans_raise:0 "Raise"
 MNT_clans_raise_tt:0 "£MNT_crisis_strength_texticon£ §YCall this clan's levy§!\nRequires §YPrepare the Clan Levies§!, war or the frontier conflict, Montenegrin control of Cetinje, and loyalty §Y0 or higher§!.\n\n§YOne division§! with 1–3 irregular battalions, according to clan strength, appears in Montenegro. Each clan can be raised §Yonce per mobilization§!. Levies stand down after all wars end.\n\n$MNT_clan_badge_tt$"
