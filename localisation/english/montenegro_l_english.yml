 MNT_clans_influence_total_tt:0 "§YCLAN POLITICAL INFLUENCE§!\nPolitical power gain: [MNTclansInfluenceTotalValue].\nThis is the sum of the stored influence of all nine clans, including the outer clans. Loyalty and levy status do not multiply it.\n\nFor example, total influence of 15% adds +15% to political power gain. It is a percentage modifier, not +0.15 flat political power per day. Other national modifiers still apply."
 MNT_clans_loyalty_0:0 "§YNeutral · 0§!"
 MNT_clans_loyalty_1:0 "§GLoyal · +1§!"
 MNT_clans_loyalty_2:0 "§GDevoted · +2§!"
 MNT_clans_loyalty_3:0 "§CSteadfast · +3§!"
 MNT_clans_loyalty_external:0 "§gLoyalty: —§!"
 MNT_clans_loyalty_minus1:0 "§ODisloyal · −1§!"
