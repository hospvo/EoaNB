 MNT_dominance_of_the_rich_ottomans:0 "Dominance of the Wealthy Ottomans"
 MNT_dominance_of_the_rich_ottomans_desc:0 "The best of our land is in the hands of wealthy Ottoman farmers, who have no interest in cooperating with us. This will be a great problem when we try to wage any kind of hostile action against the Ottoman oppressors."
 MNT_dominance_of_the_rich_ottomans_Weakening:0 "Influence of the Rich Ottomans"
 MNT_dominance_of_the_rich_ottomans_Weakening_desc:0 "Part of our economy is in the hands of rich Ottoman farmers who have no interest in working with us. This will be a problem when we try to wage hostilities against the Ottoman oppressors."
 MNT_END_OF_NEW_BEG_DESC:0 "Montenegro is a small mountainous country surrounded on all sides by big neighbours. On one side, it's stuck in the hot frontier of the Ottoman Empire, from which it tries to gain its independence at any cost, by negotiation or by blood. On another side, it's a border with Austria, which holds it's rightful land of Kotor, which makes Montenegro isolated from the sea. As a small country with big problems and another looming border clash on the horizon, interesting times are ahead for Montenegro."
