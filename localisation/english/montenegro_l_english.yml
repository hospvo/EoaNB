l_english:

 # PEACE TALKS, TREATY TERMS AND SIGNED PROMISES
 MNT_rel_advocate_tt:0 "Rebel trust §G+6§!; bargaining strength §G+3§!."
 MNT_rel_amnesty_order:0 "Herzegovina Amnesty"
 MNT_rel_amnesty_order_desc:0 "A signed pardon for participants in the uprising who return to civilian life. Stability +1%. Revoking it is an explicit breach, available in the treaty decisions."
 MNT_rel_amnesty_preview:0 "£MNT_pledge_amnesty_texticon£ §YAmnesty§!: Demands §R+4§!. Ottoman pardons for participants who lay down arms. Rebel trust §G+8§! on signing. No local charter. No non-intervention promise.\n"
 MNT_rel_amnesty_row:0 "§YAmnesty§! · [MNTrelChoiceAmnesty]\nPardons for rebels who lay down arms."
 MNT_rel_amnesty_signed:0 "£MNT_pledge_amnesty_texticon£ §YHerzegovina: Amnesty§!\n- Ottoman pardons for participants returning to civilian life.\n- Rebel trust +8 on signing; Ottoman stability +1%.\n"
 MNT_rel_amnesty_tt:0 "§YAMNESTY§!\nDemands §R+4§!. Ottoman pardons for participants who lay down arms. Rebel trust §G+8§! on signing. No local charter. No non-intervention promise.\n§YExclusive: selecting this replaces the other two choices.§!"
 MNT_rel_choice_not_selected:0 "§gNot selected§!"
 MNT_rel_choice_selected:0 "§GSelected§!"
 MNT_rel_debug_meters:0 "DEBUG: Cycle Counters — 0 / 50 / 100"
 MNT_rel_debug_meters_desc:0 "Pause a separate test save. Snapshot food, clan unrest and rebel trust, then display 0%, 50% and 100% on successive clicks. This changes real test values. Restore them with the next decision before resuming time."
 MNT_rel_debug_profile:0 "DEBUG: Apply the 1857 Law Profile"
 MNT_rel_debug_profile_desc:0 "RESET TEST LAWS: apply the new Montenegro starting laws, including low research, navy, road and social spending. This replaces your selected laws. It does not reset food, money, diplomacy or focus progress. Use a separate test save."
 MNT_rel_debug_restore_meters:0 "DEBUG: Restore Counter Values"
 MNT_rel_debug_restore_meters_desc:0 "Restore the food, clan unrest and rebel trust saved before the counter test. Keep time paused during the test."
 MNT_rel_envoy_tt:0 "Reputation §G+5§!; war tension §G-5§!."
 MNT_rel_envoys:0 "Keep an Open Channel"
 MNT_rel_envoys_desc:0 "Quiet envoys can explain our terms. Gain 5 reputation and reduce war tension by 5. This does not force Ottoman acceptance."
 MNT_rel_exclusive_tt:0 "§YONLY ONE OUTCOME§!\nThe arrows link mutually exclusive choices. Select the round button on the right. Choosing one outcome replaces the other two; you cannot combine them."
 MNT_rel_frontier:0 "Our Ottoman Neighbour"
 MNT_rel_frontier_desc:0 "Montenegro needs a frontier policy as well as patrons. Talks and war still use the Herzegovina crisis panel. This branch prepares our aims and records signed promises."
 MNT_rel_keep_word:0 "Keep Our Word"
 MNT_rel_keep_word_desc:0 "Requires a signed treaty and no broken raid or non-intervention promise. Gain 8 reputation and 3% stability. Demands on Ottoman administration are recorded as treaty obligations, not a transfer of Herzegovina."
 MNT_rel_ledger_help:0 "§YSIGNED PROMISES & RIGHTS§!\nSigned terms remain in force until fulfilled or broken."
 MNT_rel_nonintervention_preview:0 "£MNT_pledge_nonintervention_texticon£ §YStay Out§!\nDemands: §G-3§!. Rebel trust: §R-20§!. Reputation: §G+5§!.\nMilitary aid and direct rebel orders are blocked.\n"
 MNT_rel_nonintervention_row:0 "§YStay Out§! · [MNTrelChoiceNonintervention]\nMontenegro stops military aid to the rebels."
 MNT_rel_nonintervention_signed:0 "£MNT_pledge_nonintervention_texticon£ §YMontenegro: Stay Out of Herzegovina§!\n- Military aid and direct rebel orders are blocked.\n- Rebel trust -20; reputation +5 on signing.\n- No amnesty or local charter was obtained.\n- Breaking this promise has a separate diplomatic cost.\n"
 MNT_rel_nonintervention_tt:0 "§YSTAY OUT§!\nOttoman demands: §G-3§!.\nRebel trust: §R-20§!. Reputation: §G+5§!.\nMilitary aid and direct rebel orders are blocked.\nIf broken: 50 PP; reputation §R-20§!.\n£MNT_support_france_down£ French support: §R-1§!.\n£MNT_support_austria_down£ Austrian support: §R-1§!.\nOnly one Herzegovina outcome can be chosen."
 MNT_rel_obligations:0 "Signed Promises"
 MNT_rel_obligations_desc:0 "The treaty record is above The Ottoman Frontier in the focus tree. Signed promises stay recorded after a breach. Changes here never start a war automatically."
 MNT_rel_pledge_active:0 "§GIn force§!"
 MNT_rel_pledge_broken:0 "§RBroken§!"
 MNT_rel_pledge_done:0 "§GCompleted§!"
 MNT_rel_pledge_none:0 "§gNot agreed§!"
 MNT_rel_protect_rebels:0 "Speak for the Rebels"
 MNT_rel_protect_rebels_desc:0 "Gain 6 rebel trust and 3 bargaining strength. Amnesty and local rights remain separate treaty choices; local rights are much harder to obtain."
 MNT_rel_quiet_frontier:0 "Put the Border First"
 MNT_rel_quiet_frontier_desc:0 "Gain 8 reputation, lose 8 rebel trust. A promise to stay out must still be chosen and signed in talks. Taking this focus alone does not bind us."
 MNT_rel_quiet_tt:0 "Reputation §G+8§!; rebel trust §R-8§!. No treaty pledge is made yet."
 MNT_rel_read_terms:0 "Read Every Clause"
 MNT_rel_read_terms_desc:0 "Review the signed treaty. Gain 20 political power."
 MNT_rel_rebuild_contacts:0 "Rebuild Rebel Ties"
 MNT_rel_rebuild_contacts_desc:0 "After peace, resume direct support. This is blocked by a signed non-intervention promise until Montenegro openly breaks it. Gain 8 rebel trust; no new war is started."
 MNT_rel_record_amnesty:0 "§YAmnesty§!"
 MNT_rel_record_amnesty_tt:0 "§YAMNESTY§!\n[GetMNTPledgeAmnesty]\nOttoman pardon for participants returning to civilian life. Ottoman stability +1%. Revocation is an explicit breach."
 MNT_rel_record_commission:0 "§YBorder Survey§!"
 MNT_rel_record_commission_tt:0 "§YBORDER SURVEY§!\n[GetMNTPledgeCommission]\nA boundary commission follows the settlement. The treaty result shows the actual territory and 90-day troop ban. The survey is complete after the follow-up event."
 MNT_rel_record_compensation:0 "§YWar Reparations§!"
 MNT_rel_record_compensation_tt:0 "§YWAR REPARATIONS§!\n[GetMNTPledgeCompensation]\nMontenegro took over Ottoman debt when the treaty was signed. Repayment uses the national treasury."
 MNT_rel_record_discipline:0 "§YCaptain Orders§!"
 MNT_rel_record_discipline_tt:0 "§YCAPTAIN ORDERS§!\n[GetMNTPledgeDiscipline]\nCaptains have orders limiting plunder. Lifting restrictions is a separate decision. It does not cancel a raid ban."
 MNT_rel_record_nonintervention:0 "§YStay Out§!"
 MNT_rel_record_nonintervention_tt:0 "§YSTAY OUT§!\n[GetMNTPledgeNonintervention]\nMilitary aid and direct rebel orders are blocked.\nCost of breaking the pledge: 50 PP; reputation §R-20§!; £MNT_support_france_down£ French support: §R-1§!; £MNT_support_austria_down£ Austrian support: §R-1§!."
 MNT_rel_record_raids:0 "§YRaid Ban§!"
 MNT_rel_record_raids_tt:0 "§YRAID BAN§!\n[GetMNTPledgeRaids]\nNo cross-border raids. Lifting the ban costs reputation and foreign support. Hunger still affects clan unrest."
 MNT_rel_record_recognition:0 "§YRecognition§!"
 MNT_rel_record_recognition_tt:0 "§YRECOGNITION§!\n[GetMNTPledgeRecognition]\nFormal recognition was obtained in the treaty. This differs from factual self-rule. An inactive card makes no claim to recognition."
 MNT_rel_record_rights:0 "§YLocal Rights§!"
 MNT_rel_record_rights_tt:0 "§YLOCAL RIGHTS§!\n[GetMNTPledgeRights]\nOttoman local council charter. Includes amnesty. Charter: Ottoman stability +2%, daily PP -0.05. No transfer of territory."
 MNT_rel_refugee_tt:0 "£supply_texticon£ Food §R-10§!; rebel trust §G+8§!; reputation §G+3§!."
 MNT_rel_refugees:0 "Shelter the Families"
 MNT_rel_refugees_desc:0 "Spend 10 food on refugee families. Gain 8 rebel trust and 3 reputation. This does not start a raid."
 MNT_rel_release_captains:0 "Lift the Captains’ Restrictions"
 MNT_rel_release_captains_desc:0 "Remove the earlier order limiting plunder. This does not cancel a separate raid ban or start a raid."
 MNT_rel_release_tt:0 "Clan unrest §G-6§!; domestic clan loyalty §G+1§!; reputation §R-10§!. The old discipline promise is recorded as broken."
 MNT_rel_renounce_interference:0 "End the Non-Intervention Promise"
 MNT_rel_renounce_interference_desc:0 "Openly resume support for the Herzegovina rebels. The broken promise remains in the treaty record."
 MNT_rel_renounce_tt:0 "Military aid to the rebels becomes available.\nReputation: §R-20§!.\n[GetMNTSupportFranceLoss]\n[GetMNTSupportAustriaLoss]"
 MNT_rel_revoke_amnesty:0 "Revoke the Herzegovina Pardon"
 MNT_rel_revoke_amnesty_desc:0 "Withdraw the treaty pardon and any local charter attached to it. This breaches the signed settlement."
 MNT_rel_revoke_tt:0 "Remove the amnesty and local-rights national spirits. Rebel trust in MNT §R-10§!; war tension §R+10§!. Montenegro receives a report. §YNo automatic war.§!"
 MNT_rel_rights_charter:0 "Herzegovina Local Charter"
 MNT_rel_rights_charter_desc:0 "The treaty recognizes local councils and complaints through representatives in Ottoman Herzegovina. Stability +2%; daily political power -0.05 for administration. Includes amnesty. No state changes owner."
 MNT_rel_rights_preview:0 "£MNT_pledge_rights_texticon£ §YLocal Rights§!: Demands §R+9§!. Requires reputation §Y60§!, French support §Y2§! and Russian support §Y1§!. Includes amnesty and a local council charter. Rebel trust §G+15§!. Ottoman administration: stability +3% in total, daily PP -0.05. No territory is transferred.\n"
 MNT_rel_rights_row:0 "§YLocal Rights§! · [MNTrelChoiceRights]\nAmnesty and rights for local councils."
 MNT_rel_rights_signed:0 "£MNT_pledge_rights_texticon£ §YHerzegovina: Local Rights and Amnesty§!\n- Pardons and a charter for local councils and representatives.\n- Rebel trust +15 on signing; Ottoman stability +3%, daily PP -0.05.\n- Herzegovina stays under Ottoman rule.\n"
 MNT_rel_rights_tt:0 "§YLOCAL RIGHTS§!\nDemands §R+9§!. Requires reputation §Y60§!, French support §Y2§! and Russian support §Y1§!. Includes amnesty and a local council charter. Rebel trust §G+15§!. Ottoman administration: stability +3% in total, daily PP -0.05. No territory is transferred.\n§YExclusive: selecting this replaces the other two choices.§!"
 MNT_rel_status_amnesty:0 "[GetMNTPledgeAmnesty]"
 MNT_rel_status_commission:0 "[GetMNTPledgeCommission]"
 MNT_rel_status_compensation:0 "[GetMNTPledgeCompensation]"
 MNT_rel_status_discipline:0 "[GetMNTPledgeDiscipline]"
 MNT_rel_status_nonintervention:0 "[GetMNTPledgeNonintervention]"
 MNT_rel_status_raids:0 "[GetMNTPledgeRaids]"
 MNT_rel_status_recognition:0 "[GetMNTPledgeRecognition]"
 MNT_rel_status_rights:0 "[GetMNTPledgeRights]"
 MNT_rel_terms_heading:0 "§YHERZEGOVINA: CHOOSE ONE OUTCOME§!"
 MNT_rel_title:0 "§YTHE OTTOMAN FRONTIER§!"
 MNT_treaty_base_independence:0 "£MNT_treaty_sovereignty_texticon£ [MNT.GetFlag] Montenegro leaves Ottoman rule.\n- Both sides agree to end the crisis.\n"
 MNT_treaty_base_row_independence:0 "§YIndependence & Ceasefire§!\n[MNT.GetFlag] Montenegro leaves Ottoman rule."
 MNT_treaty_base_row_status_quo:0 "§YCeasefire§!\n[MNT.GetFlag] Montenegro keeps its current status."
 MNT_treaty_base_status_quo:0 "£MNT_treaty_sovereignty_texticon£ Both sides agree to end the crisis.\n- Montenegro keeps its current status.\n"
 MNT_treaty_base_title:0 "§YALWAYS INCLUDED§!"
 MNT_treaty_commission_done:0 "The border commission has finished its work."
 MNT_treaty_commission_pending:0 "Next: the border commission reports 90 days after signing."
 MNT_treaty_deadline:0 "§YToo late to send a new proposal. Final offer soon.§!"
 MNT_treaty_demand_arms_tt:0 "§YARMS IMPORTS§!\nOttoman demands: §R+2§!\n[MNT.GetFlag] Montenegro gains the §Yright to import arms§!.\n§YNo rifles are delivered by this treaty.§!"
 MNT_treaty_demand_border_tt:0 "§YGAIN TERRITORY§!\nOttoman demands: §R+5§!\nOn signing, [MNT.GetFlag] Montenegro gains §YOuter Montenegro§! if [OTO.GetFlag] the Ottomans still own it.\nNo troops may enter it for §Y90 days§!. The border commission then lifts this limit."
 MNT_treaty_demand_recognition_tt:0 "§YFORMAL RECOGNITION§!\nOttoman demands: §R+8§!\nRecords formal recognition of [MNT.GetFlag] Montenegro.\n\n§YAlso requires:§!\n- Rebel strength §Y75+§!.\n- [FRA.GetFlag] France: §YMediation (2+)§!.\n- [RUS.GetFlag] Russia: §YMediation (2+)§!.\n\nIn-game independence is already in the basic deal."
 MNT_treaty_gains_title:0 "§YWHAT WE GAIN§!"
 MNT_treaty_independence_tt:0 "§YAlways included in the deal§!\n[MNTtreatyBasePreview]\nLeaving Ottoman rule makes Montenegro independent in game. §YFormal Recognition§! is a separate term."
 MNT_treaty_no_rounds:0 "§RAll 3 proposals used. Wait for the final offer.§!"
 MNT_treaty_not_ready:0 "§RThis deal will be rejected. Add promises or drop demands.§!"
 MNT_treaty_offer_guarantee_tt:0 "§YSTOP BORDER RAIDS§!\nOttoman demands: §G-3§!\n[MNT.GetFlag] Montenegro promises to control border raids.\n[AUS.GetFlag] §YAustrian pressure (3) locks this promise in.§!"
 MNT_treaty_offer_reparations_tt:0 "§YWAR REPARATIONS§!\nOn signing:\n[MNT.GetFlag] National debt: §R+1 million pounds§!.\n[OTO.GetFlag] National debt: §G-1 million pounds§!.\nOttoman demands: §G-2§!.\nMontenegro must repay this debt later."
 MNT_treaty_payment:0 "[MNTtreatyPayment]"
 MNT_treaty_payment_no:0 "On signing: No reparations."
 MNT_treaty_payment_yes:0 "On signing: [MNT.GetFlag] debt §R+1M§! / [OTO.GetFlag] debt §G-1M§!."
 MNT_treaty_promises_title:0 "§YOUR PROMISES§!"
 MNT_treaty_ready:0 "§GReady to send. The Ottoman player can still refuse.§!"
 MNT_treaty_rounds:0 "Proposals used: §Y[?MNT.MNT_crisis_round|0]/3§!   ·   Talks: §Y[?MNT.MNT_crisis_phase_days|0]/56 days§!"
 MNT_treaty_row_demand_arms:0 "§YArms Imports§! · [MNTcrisis_demand_arms]\n[MNT.GetFlag] Montenegro can import arms."
 MNT_treaty_row_demand_border:0 "§YGain Territory§! · [MNTcrisis_demand_border]\n[MNT.GetFlag] Montenegro gains Outer Montenegro."
 MNT_treaty_row_demand_recognition:0 "§YFormal Recognition§! · [MNTcrisis_demand_recognition]\n[MNT.GetFlag] Montenegro gains official recognition."
 MNT_treaty_row_independence:0 "[MNTtreatyBaseRow]"
 MNT_treaty_row_offer_guarantee:0 "§YStop Border Raids§! · [MNTcrisis_offer_guarantee]\n[MNT.GetFlag] Montenegro pledges to stop raids."
 MNT_treaty_row_offer_reparations:0 "§YWar Reparations§! · [MNTcrisis_offer_reparations]\n[MNT.GetFlag] Debt §R+1M§! / [OTO.GetFlag] debt §G-1M§!."
 MNT_treaty_score:0 "Leverage: §G[?MNT.MNT_crisis_leverage|0]§!  |  Cost: §Y[?MNT.MNT_crisis_price|0]§!"
 MNT_treaty_score_tt:0 "§YBargaining power§! comes from rebel strength, reputation and foreign support.\nYour power must meet §YOttoman demands§! for the deal to be accepted.\nBase demands: §Y6§!\nTerritory: §R+5§! · Arms: §R+2§! · Recognition: §R+8§!\nBorder pledge: §G-3§! · Compensation: §G-2§!\nHerzegovina: Amnesty §R+4§! / Local Rights §R+9§! / Stay Out §G-3§!. Choose one.\n\nRecognition also needs §Y75 rebel strength§!, [FRA.GetFlag] §YFrance 2+§! and [RUS.GetFlag] §YRussia 2+§!."
 MNT_treaty_send:0 "Send Proposal"
 MNT_treaty_send_tt:0 "§YSEND PROPOSAL§!\n[MNTtreatyStatus]\n\nUses §Y1 of 3 proposals§!. Reply in §Y7 days§!.\nYou cannot edit terms while waiting.\nCompensation is paid §Yonly when the deal is signed§!.\n\n§YOnly Montenegro can send this proposal.§!"
 MNT_treaty_signed_arms:0 "£MNT_treaty_arms_texticon£ [MNT.GetFlag] Montenegro gained arms import rights.\n"
 MNT_treaty_signed_border:0 "£MNT_treaty_frontier_texticon£ [MNT.GetFlag] Montenegro gained Outer Montenegro.\n- Troop ban: 90 days from signing.\n"
 MNT_treaty_signed_ceasefire:0 "£MNT_treaty_sovereignty_texticon£ The crisis has ended. A ceasefire is agreed.\n"
 MNT_treaty_signed_guarantee:0 "£MNT_treaty_guarantee_texticon£ [MNT.GetFlag] Montenegro promised to stop border raids.\n"
 MNT_treaty_signed_independence:0 "£MNT_treaty_sovereignty_texticon£ [MNT.GetFlag] Montenegro is free of Ottoman rule.\n- The crisis has ended.\n"
 MNT_treaty_signed_recognition:0 "£MNT_treaty_recognition_texticon£ [MNT.GetFlag] Montenegro gained formal recognition.\n"
 MNT_treaty_signed_reparations:0 "£MNT_treaty_reparations_texticon£ [MNT.GetFlag] Took on §R[?MNT.MNT_reparations_amount|2]M national debt§!. [OTO.GetFlag] Debt reduced by §G[?MNT.MNT_reparations_oto_relief|2]M§!.\n"
 MNT_treaty_signed_reparations_legacy:0 "£MNT_treaty_reparations_texticon£ Compensation was paid under the old treaty. No new debt.\n"
 MNT_treaty_status:0 "[MNTtreatyStatus]"
 MNT_treaty_status_tt:0 "[MNTtreatyStatus]\n\nA reply takes §Y7 days§!. You may send §Y3 proposals§!. Talks last §Y56 days§!; new proposals must be sent before §Yday 50§!.\n\n§YOnly Montenegro can change or send its proposal.§!"
 MNT_treaty_title:0 "§YPEACE TALKS§!"
 MNT_treaty_waiting:0 "§YWaiting for the Ottoman reply. Terms are locked.§!"

 # HERZEGOVINIAN UPRISING AND CRISIS DECISIONS
 MNT_crisis_active:0 "The frontier crisis is active"
 MNT_crisis_ammo_prepared_tt:0 "£MNT_crisis_supply_texticon£ Supplies: §G+35 days§!\n£MNT_crisis_strength_texticon£ Rebel strength: §G+8§!\n§GOur guides know the crossing.§!"
 MNT_crisis_ammo_unprepared_tt:0 "£MNT_crisis_supply_texticon£ Supplies: §G+21 days§!\n§gNo prepared route: no strength bonus.§!"
 MNT_crisis_ammunition:0 "OPERATION · Ammunition for Vukalović"
 MNT_crisis_ammunition_desc:0 "Commit 25 rifles and organize a crossing (10 days). Then choose guides or an armed escort.\n\nGuides: +21 supply days, +3 war tension. With a prepared route or the arms focus: +35 days and +8 strength.\nEscort: +45 days, +12 strength, +16 war tension, -5 reputation.\n\nOne covert operation can be prepared at a time. Supplies are capped at 90 days. If talks begin first, the committed rifles remain spent."
 MNT_crisis_appeal_austria:0 "DIPLOMACY · Send a dossier to Vienna"
 MNT_crisis_appeal_austria_desc:0 "Request an independent reply (7 days). Credibility of at least 45 and war tension below 75 permit mediation (level 2); otherwise only sympathy (level 1) is available. Each level contributes two points of bargaining power. Other patrons remain available."
 MNT_crisis_appeal_france:0 "DIPLOMACY · Send a dossier to Paris"
 MNT_crisis_appeal_france_desc:0 "Request an independent reply (7 days). Credibility of at least 45 and war tension below 75 permit mediation (level 2); otherwise only sympathy (level 1) is available. Each level contributes two points of bargaining power. Other patrons remain available."
 MNT_crisis_appeal_russia:0 "DIPLOMACY · Send a dossier to St Petersburg"
 MNT_crisis_appeal_russia_desc:0 "Request an independent reply (7 days). Credibility of at least 45 and war tension below 75 permit mediation (level 2); otherwise only sympathy (level 1) is available. Each level contributes two points of bargaining power. Other patrons remain available."
 MNT_crisis_austria_card:0 "[AUS.GetFlag] Austria\n[MNTcrisis_austria]"
 MNT_crisis_austrian_guarantee:0 "MEDIATION · Offer Vienna a quiet frontier"
 MNT_crisis_austrian_guarantee_desc:0 "Pledge to stop border raids.\n[GetMNTSupportAustriaPressure]\nWar tension: §G-10§!.\nFrontier guarantee added to the treaty."
 MNT_crisis_austrian_war_cost_tt:0 "[GetMNTSupportAustriaLoss2]\nRelations: £MNT_support_austria_down£\n"
 MNT_crisis_can_edit_treaty_tt:0 "Negotiations are in progress and no Ottoman reply is pending."
 MNT_crisis_can_operate_tt:0 "Support the Herzegovinian Uprising is complete, indirect war is ongoing, and no operation is being prepared."
 MNT_crisis_caps_tt:0 "§gChanges stop at the gauge limits: strength, war tension and reputation 0–100; supplies 0–90 days.§!"
 MNT_crisis_captains:0 "SITUATION · The clan captains"
 MNT_crisis_captains_desc:0 "Meet the border captains (7 days). Choose disciplined assistance (+8 strength, +12 reputation, +2 war tension) or unrestricted raids (+16 strength, -15 reputation, +15 war tension). That choice affects the later boundary settlement."
 MNT_crisis_captains_seen:0 "Terms with the clan captains have already been settled"
 MNT_crisis_cattaro:0 "OPERATION · Merchants of Cattaro"
 MNT_crisis_cattaro_backed_tt:0 "£MNT_crisis_supply_texticon£ Supplies: §G+38 days§!\n£MNT_crisis_escalation_texticon£ War tension: §G−3§!\n[AUS.GetFlag] §GAustrian backing protects the traffic.§!"
 MNT_crisis_cattaro_desc:0 "Pay £currency_texticons|2 15,000 from the national treasury and arrange a commercial supply route (14 days). The fee is paid now and is not refunded if talks begin before delivery. Austria must be at peace with us. +28 supply days and a prepared route. Austrian sympathy or mediation adds another 10 days and reduces war tension by 3; otherwise the traffic adds 5 war tension."
 MNT_crisis_cattaro_unbacked_tt:0 "£MNT_crisis_supply_texticon£ Supplies: §G+28 days§!\n£MNT_crisis_escalation_texticon£ War tension: §R+5§!\n[AUS.GetFlag] §YWithout Austrian backing, the traffic attracts attention.§!"
 MNT_crisis_commission_border_tt:0 "£MNT_treaty_frontier_texticon£ [MNT.GetFlag] §GTroops can enter Outer Montenegro again.§!\n"
 MNT_crisis_commission_gain_tt:0 "£stability_texticon£ Stability: §G+3%§!\n- Keeping raids under control has strengthened the deal."
 MNT_crisis_commission_loss_tt:0 "£stability_texticon£ Stability: §R−3%§!\n- Uncontrolled raids have weakened the deal."
 MNT_crisis_covert_phase_tt:0 "The crisis is in the indirect-war phase."
 MNT_crisis_dispatch:0 "[MNTcrisisDispatch]"
 MNT_crisis_effect_1_a:0 "$MNT_crisis_rules_tt$\n\n$MNT_crisis_caps_tt$"
 MNT_crisis_effect_2_a:0 "§YQUIET CROSSING§!\n[MNTcrisisAmmoPreview]\n£MNT_crisis_escalation_texticon£ War tension: §R+3§!\n\n§YPrepared routes or the arms focus improve this option.§!\n$MNT_crisis_caps_tt$\n£MNT_crisis_credibility_texticon£ Vukalović’s trust: §G+6§! (0–100)."
 MNT_crisis_effect_2_b:0 "§YARMED ESCORT§!\n£MNT_crisis_supply_texticon£ Supplies: §G+45 days§!\n£MNT_crisis_strength_texticon£ Rebel strength: §G+12§!\n£MNT_crisis_escalation_texticon£ War tension: §R+16§!\n£MNT_crisis_credibility_texticon£ Reputation: §R−5§!\n\n§YThe delivery is larger, but Ottoman observers can trace our involvement.§!\n$MNT_crisis_caps_tt$\n£MNT_crisis_credibility_texticon£ Vukalović’s trust: §G+10§! (0–100)."
 MNT_crisis_effect_3_a:0 "§YDISCIPLINED ASSISTANCE§!\n£MNT_crisis_strength_texticon£ Rebel strength: §G+8§!\n£MNT_crisis_credibility_texticon£ Reputation: §G+12§!\n£MNT_crisis_escalation_texticon£ War tension: §R+2§!\n\n§YThe captains must protect civilians.§! The boundary commission will assess their conduct.\n$MNT_crisis_caps_tt$\n£MNT_crisis_credibility_texticon£ Vukalović’s trust: §G+4§! (0–100).\n£stability_texticon£ Clan politics: §R+6 unrest§! and §R-1 domestic clan loyalty§!, once."
 MNT_crisis_effect_3_b:0 "§YUNRESTRICTED RAIDS§!\n£MNT_crisis_strength_texticon£ Rebel strength: §G+16§!\n£MNT_crisis_escalation_texticon£ War tension: §R+15§!\n£MNT_crisis_credibility_texticon£ Reputation: §R−15§!\n\n£stability_texticon£ §RThe later boundary commission will cost 3% stability.§!\n$MNT_crisis_caps_tt$\n£MNT_crisis_credibility_texticon£ Vukalović’s trust: §G+8§! (0–100).\n£stability_texticon£ Clan politics: §G-6 unrest§! and §G+1 domestic clan loyalty§!, once."
 MNT_crisis_effect_4_a:0 "§YDOCUMENT THE FRONTIER§!\n£MNT_crisis_credibility_texticon£ Reputation: §G+18§!\n£MNT_crisis_escalation_texticon£ War tension: §G−8§!\n£MNT_crisis_strength_texticon£ Rebel strength: §R−4§!\n\n£MNT_crisis_diplomacy_texticon£ §YUnlocks Vaclík's memorandum§! if it has not already been used.\n$MNT_crisis_caps_tt$\n£MNT_crisis_credibility_texticon£ Vukalović’s trust: §R−4§! (0–100)."
 MNT_crisis_effect_4_b:0 "§YSELECTIVE REPORTS§!\n£MNT_crisis_credibility_texticon£ Reputation: §R−12§!\n£MNT_crisis_escalation_texticon£ War tension: §R+8§!\n\n§YThis weakens our case for foreign mediation.§!\n$MNT_crisis_caps_tt$"
 MNT_crisis_effect_6_a:0 "§YCATTARO SUPPLY ROUTE§!\n[MNTcrisisCattaroPreview]\n\n£MNT_crisis_supply_texticon£ §YEstablishes prepared routes§! for future ammunition crossings.\n$MNT_crisis_caps_tt$"
 MNT_crisis_effect_7_a:0 "[GetMNTPatronMediationResult]\nStronger support is kept."
 MNT_crisis_effect_7_b:0 "[GetMNTPatronSympathyResult]\nStronger support is kept."
 MNT_crisis_effect_10_a:0 "£MNT_crisis_diplomacy_texticon£ §YChoose your terms in Decisions.§!\nMatch §Gbargaining power§! against §YOttoman demands§!.\n§Y3 proposals · 56 days · replies in 7 days§!\n£MNT_crisis_supply_texticon£ Supplies are not used during talks."
 MNT_crisis_effect_11_a:0 "§YSIGN THE PEACE DEAL§!\n[MNTtreatyBasePreview][MNTcrisisTreatyBorder][MNTcrisisTreatyArms][MNTcrisisTreatyRecognition][MNTcrisisTreatyGuarantee][MNTcrisisTreatyReparations][MNTrelTermsPreview][MNTcrisisTreatyFocus]\n§YBorder commission: 90 days.§!\nMontenegro gets £political_power_texticon£ §G+25§! when it confirms the deal after §Y1 day§!."
 MNT_crisis_effect_11_b:0 "£MNT_crisis_diplomacy_texticon£ §RRejects this package.§!\nMontenegro is notified after §Y1 day§!.\n§YThe submission was counted when sent.§! A third rejection leads to a final choice between limited terms and open war."
 MNT_crisis_effect_12_a:0 "£political_power_texticon£ Political power: §G+25§!\n§YThe treaty terms are already in effect.§!"
 MNT_crisis_effect_13_a:0 "§YBOUNDARY COMMISSION§!\n[MNTcrisisCommissionBorder][MNTcrisisCommissionStability]\n§YCloses the commission.§!"
 MNT_crisis_effect_14_a:0 "§YTAKE THE BASIC DEAL§!\n[MNTtreatyBasePreview]£MNT_treaty_guarantee_texticon£ Promise to §Ystop border raids§!.\nNo extra territory, arms rights or formal recognition.\nNo compensation payment.\n[MNTcrisisTreatyFocus]\nBorder commission in §Y90 days§!. Treaty event in §Y1 day§!: £political_power_texticon£ §G+25§! on confirmation."
