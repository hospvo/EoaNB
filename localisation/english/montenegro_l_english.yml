 MNT_Disconnected_Nahiyahs1:0 "Disconnected Nahiyahs"
 MNT_Disconnected_Nahiyahs1_desc:0 "Nahiyahs (village settlements with some kind of self managing autonomy) are thrown all around our country. Our biggest problem is that they are sometimes very hardly accessible and that means they are unadministrable. We need to change that and connect them to our infrastructure network to easily rule through all of Montenegro and not only some big cities on main roads."
