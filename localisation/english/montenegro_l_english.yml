 MNT_clan_badge_tt:0 "£MNT_clan_badge_texticon£ §YBlack Mountain Badge§!\nAttack on own core territory: §G+5%§!\nDefence on own core territory: §G+5%§!\n\nIssued automatically when this clan is raised. Requires §YBy Blood Alone§!."
 MNT_clan_muster_history:0 "Answered the clan's call to arms"
 MNT_clan_muster_marker:0 "Clan Muster"
 MNT_clan_muster_marker_desc:0 "A clan levy assembling for service."
 MNT_clans_badge_no_dlc:0 "§gInactive: division medals require By Blood Alone.§!"
 MNT_clans_badge_on_call:0 "§YIssued when this clan is raised.§! Requires By Blood Alone. No combat bonus is applied to an unraised clan."
