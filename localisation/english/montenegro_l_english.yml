 MNT_crisis.1.a:0 "View the uprising."
 MNT_crisis.1.d:0 "Herzegovina is in revolt. We can send supplies and support the rebels without declaring war. Armed escorts and raids will make war more likely.\n\nKeep the rebels supplied, win foreign support, then use your bargaining power to make a deal. The panel in Decisions shows rebel strength, supplies and war tension."
 MNT_crisis.1.t:0 "Support the Herzegovinian Uprising"
 MNT_crisis.2.a:0 "Use guides and small mule trains."
 MNT_crisis.2.b:0 "Send an armed escort."
 MNT_crisis.2.d:0 "A messenger from Vukalović asks for ammunition. Ottoman patrols watch the border. Guides can take small groups through quietly. An armed escort can carry more, but the Ottomans will know we sent it."
 MNT_crisis.2.t:0 "Vukalović's ammunition request"
 MNT_crisis.3.a:0 "Keep the captains under control."
 MNT_crisis.3.b:0 "Let the captains raid freely."
 MNT_crisis.3.d:0 "Clan captains offer men and guides. They expect freedom to choose their targets. Cetinje can demand discipline and protection for civilians, or let the captains turn the uprising into a cycle of raids and reprisals."
 MNT_crisis.3.t:0 "The captains of the border clans"
 MNT_crisis.4.a:0 "Report all attacks, including our own."
 MNT_crisis.4.b:0 "Hide reports against our men."
 MNT_crisis.4.d:0 "Foreign consuls are hearing reports of attacks on civilians. Some blame Ottoman troops. Others blame the rebels. An honest report will improve our reputation abroad, but our own men may resent it."
 MNT_crisis.4.t:0 "Conflicting reports from Herzegovina"
 MNT_crisis.6.a:0 "Move the supplies quietly."
 MNT_crisis.6.d:0 "Merchants in Cattaro offer to move supplies across the Austrian border. Austrian support will make the route safer. Vienna expects us to keep border raids under control."
 MNT_crisis.6.t:0 "The merchants of Cattaro"
 MNT_crisis.7.a:0 "Support peace talks. Demand restraint."
 MNT_crisis.7.b:0 "Offer support, but make no promises."
 MNT_crisis.7.d:0 "Montenegro asks for help over the uprising in Herzegovina. We can support peace talks or offer sympathy.\n\nFrance can send ships to add pressure. Russia can fund supplies. Austria can support trade and a border deal. Each country decides its own level of support."
 MNT_crisis.7.t:0 "An appeal from Cetinje"
 MNT_crisis.10.a:0 "Build our proposal."
 MNT_crisis.10.d:0 "Negotiator: [GetMNTDiplomacyDelegate].\n\nOpen Decisions and choose the terms of your peace deal.\n\nAlways included: a ceasefire and an end to Ottoman rule over Montenegro.\n\nWhat we gain: territory, arms imports and formal recognition. These raise Ottoman demands.\n\nOur promises: stop border raids or pay compensation. These lower Ottoman demands.\n\nYou have 3 proposals and 56 days. Each reply takes 7 days. Supplies are not used during talks."
 MNT_crisis.10.t:0 "Peace Talks Begin"
 MNT_crisis.11.a:0 "Sign the deal."
 MNT_crisis.11.b:0 "Reject the proposal."
 MNT_crisis.11.d:0 "Negotiator: [GetMNTDiplomacyDelegate]\n\nMontenegro offers the following terms:\n\n[MNTtreatyBasePreview][MNTcrisisTreatyBorder][MNTcrisisTreatyArms][MNTcrisisTreatyRecognition][MNTcrisisTreatyGuarantee][MNTcrisisTreatyReparations][MNTrelTermsPreview]\nBargaining power: [?MNT.MNT_crisis_leverage|0]\nOttoman demands: [?MNT.MNT_crisis_price|0]\n[MNTcrisisReadiness]\n\nAccept to end the crisis on these terms. Reject to ask for a new proposal."
 MNT_crisis.11.t:0 "Montenegro Sends a Peace Proposal"
 MNT_crisis.12.a:0 "Confirm the deal."
 MNT_crisis.12.d:0 "The peace deal is now in force.\n\n[MNTtreatySignedBase][MNTtreatySignedBorder][MNTtreatySignedArms][MNTtreatySignedRecognition][MNTtreatySignedGuarantee][MNTtreatySignedReparations][MNTrelTermsSigned]\n[MNTtreatyCommissionStatus]"
 MNT_crisis.12.t:0 "Peace Deal Signed"
 MNT_crisis.13.a:0 "Confirm the results."
 MNT_crisis.13.d:0 "The border commission has finished its work.\n\n[MNTcrisisCommissionBorder][MNTcrisisCommissionStability]\n\nConfirm to apply these changes."
 MNT_crisis.13.t:0 "Border Talks Complete"
 MNT_crisis.14.a:0 "Take the basic deal."
 MNT_crisis.14.b:0 "Declare war."
 MNT_crisis.14.d:0 "Time is running out. Our supporters offer a basic deal:\n\n- Montenegro leaves Ottoman rule.\n- Both sides agree to end the crisis.\n- Montenegro promises to stop border raids.\n- No extra territory, arms rights or formal recognition.\n- No compensation payment.\n\nAccept these terms or declare war on the Ottoman Empire."
 MNT_crisis.14.t:0 "One Last Deal"
 MNT_crisis.15.a:0 "Change our terms."
 MNT_crisis.15.d:0 "The Ottoman delegation has rejected our proposal. Remove demands or add a promise to make the deal easier to accept.\n\nProposals used: [?MNT.MNT_crisis_round|0]/3. After the third rejection, you must take a basic deal or declare war."
 MNT_crisis.15.t:0 "Proposal Rejected"
 MNT_crisis.20.a:0 "Authorize the assistance."
 MNT_crisis.20.b:0 "Our mediation is sufficient."
 MNT_crisis.20.d:0 "Cetinje asks us to turn mediation into concrete pressure. We can offer the requested assistance, or maintain our present diplomatic position. Assistance is limited to this frontier crisis and does not declare war on the Ottoman Empire."
 MNT_crisis.20.t:0 "A French squadron for the Adriatic"
 MNT_crisis.21.a:0 "Authorize the assistance."
 MNT_crisis.21.b:0 "Our mediation is sufficient."
 MNT_crisis.21.d:0 "Cetinje asks us to turn mediation into concrete pressure. We can offer the requested assistance, or maintain our present diplomatic position. Assistance is limited to this frontier crisis and does not declare war on the Ottoman Empire."
 MNT_crisis.21.t:0 "Russian funds for the frontier"
 MNT_crisis.22.a:0 "Authorize the assistance."
 MNT_crisis.22.b:0 "Our mediation is sufficient."
 MNT_crisis.22.d:0 "Cetinje asks us to turn mediation into concrete pressure. We can offer the requested assistance, or maintain our present diplomatic position. Assistance is limited to this frontier crisis and does not declare war on the Ottoman Empire."
 MNT_crisis.22.t:0 "An Austrian guarantee of mediation"
 MNT_crisis.40.a:0 "Back to the uprising."
 MNT_crisis.40.d:0 "Trust in Cetinje: [MNTcrisisVukalovicValue]/100\n\nVukalović leads the rebels in this campaign. Sending ammunition and working with the captains builds trust. Pausing aid to collect reports costs trust.\n\nTrust starts at 50. It has four levels: strained relations (0–24), wary (25–49), cooperative (50–74), and trusted partner (75–100).\n\nTrust tracks your relationship with the rebel leader. It gives no combat bonus. Rebel strength, supplies, reputation and clan loyalty are tracked separately."
 MNT_crisis.40.t:0 "Luka Vukalović"
