 montenegro.229.a:0 "We need to be more carefull in the future."
 montenegro.229.d:0 "Despite high expectations, the reform has encountered numerous challenges and obstacles, resulting in its failure. One of the main issues was the lack of proper planning and coordination, insufficient infrastructure, or lack of funding for our reform. We failed, but that isn't the end of the day, and we need to learn from our mistakes to make our other reforms succeed."
 montenegro.229.t:0 "Reform of Industrial Sector Failed"
 montenegro.230.a:0 "Great industrial power for great nation."
 montenegro.230.d:0 "Throw bold moves to revitalize our nation's economy and embrace progress. We have launched a successful industrial reform. With meticulous planning and strategic implementation, the reform has brought about an era of unprecedented growth never seen in our history. By this, we gain resources to continue the reformation of our nation. Through this, we also improved not only our economic situation but our infrastructure and living conditions as a whole."
 montenegro.230.t:0 "Reform of Industrial Sector Succeeded"
