 MNT_Kotor_Bay_Trade1:0 "Expanded Trade in Kotor Bay"
 MNT_Kotor_Bay_Trade1_desc:0 "Seen by both sides as a good deal, we manage to agree upon the expansion of treaty, which we had with Austrians about trade in Kotor bay. For us it's deal from heaven because Kotor bay is the safest way for goods and passanger, how to get into Montenegro."
 MNT_Kotor_Bay_Trade_desc:0 "Kotor bay is for us very important link to outside world. We managed to signht agreement about trade cooperation in bay's water. This create for us great trade opportunity, which we need use for better export condition of our goods in world market."
