 MNT_local_montenegrin_agriculture:0 "Small Farmers Dominance in Agriculture"
 MNT_local_montenegrin_agriculture_desc:0 "When they get in their hands their new job as independent farmers, they could outproduce our Ottoman counterparts. By this many of Montenigrin families now get new hope and goals in our national struggle for independence."
