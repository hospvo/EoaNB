 MNT_underdeveloped_state_apparatus:0 "Underdeveloped State Apparatus"
 MNT_advisor_underdeveloped_state_apparatus:0 "Underdeveloped State Apparatus"
 MNT_advisor_underdeveloped_state_apparatus_desc:0 "The prince relies on a small staff, scattered records and personal intermediaries. The machinery of government cannot be dismissed like an individual minister: this seat remains occupied until a state-administration reform replaces it."
 MNT_underdeveloped_state_apparatus_trait:0 "Underdeveloped State Apparatus"
 MNT_underdeveloped_state_apparatus_trait_desc:0 "A small civil service struggles to maintain records and coordinate the work of government. This institutional advisor cannot be dismissed manually. A future reform must replace the apparatus."
